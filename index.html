<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#203B37">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="햇살집">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="남위례역 도보 4분, 햇살 가득한 15층 오피스텔 단기 숙박 예약">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>남위례 햇살집</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: forest header band, cream ground, white cards; mint = action, copper = rare accent (ConvoTrans system) */
:root{
  /* ConvoTrans brand anchors */
  --brand-cream:#EEE8B2; --brand-copper:#C18D52; --brand-ink:#081B1B;
  --brand-forest:#203B37; --brand-sage:#5A8F76; --brand-mint:#96CDB0;
  /* ramps */
  --mint-50:#EEF8F2; --mint-100:#DDF0E5; --mint-300:#96CDB0; --mint-500:#5A8F76; --mint-700:#3E6E59; --mint-900:#173A2E;
  --forest-50:#EEF3F1; --forest-100:#DCE6E3; --forest-300:#8FA8A2; --forest-400:#5B6F6A; --forest-500:#3B5F58;
  --forest-700:#203B37; --forest-800:#0F2826; --forest-900:#081B1B;
  --cream-50:#FBF9EE; --cream-100:#F6F2D6; --cream-200:#E7E4CC; --cream-300:#EEE8B2;
  --copper-100:#F4E7D6; --copper-500:#C18D52; --copper-700:#8E6232;
  --white:#FFFFFF; --red-500:#B3433A; --red-100:#F7E0DC;

  /* semantic (light) */
  --bg:var(--cream-50); --surface:var(--white); --ink:var(--brand-ink); --muted:var(--forest-400); --line:var(--cream-200);
  --sun:var(--brand-mint); --sun-ink:var(--brand-ink); --sun-soft:var(--mint-100);
  --pine:var(--mint-700); --pine-soft:var(--mint-100);
  --pend:var(--copper-500); --pend-soft:var(--copper-100); --pend-ink:var(--copper-700);
  --rose:var(--red-500); --rose-soft:var(--red-100);
  --hdr:var(--brand-forest); --hdr-ink:var(--cream-100); --hdr-muted:var(--forest-300);
  --sel-bg:var(--brand-forest); --sel-ink:var(--cream-100);
  --accent:var(--brand-copper);
  --sky1:var(--cream-100); --sky2:var(--brand-cream); --ridge1:var(--brand-sage); --ridge2:var(--brand-forest);

  --display:"Chakra Petch","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --body:"Plus Jakarta Sans","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:var(--forest-900); --surface:var(--forest-800); --ink:var(--cream-100); --muted:var(--forest-300); --line:var(--forest-700);
  --sun:var(--brand-mint); --sun-ink:var(--brand-ink); --sun-soft:var(--mint-900);
  --pine:var(--mint-300); --pine-soft:var(--mint-900);
  --pend:var(--copper-500); --pend-soft:#3A2C1C; --pend-ink:var(--copper-500);
  --rose:#E98A7F; --rose-soft:#3A2321;
  --hdr:var(--forest-800); --hdr-ink:var(--cream-100); --hdr-muted:var(--forest-300);
  --sel-bg:var(--brand-mint); --sel-ink:var(--brand-ink);
  --sky1:var(--forest-800); --sky2:var(--forest-700); --ridge1:var(--forest-500); --ridge2:var(--forest-900); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:var(--forest-900); --surface:var(--forest-800); --ink:var(--cream-100); --muted:var(--forest-300); --line:var(--forest-700);
  --sun:var(--brand-mint); --sun-ink:var(--brand-ink); --sun-soft:var(--mint-900);
  --pine:var(--mint-300); --pine-soft:var(--mint-900);
  --pend:var(--copper-500); --pend-soft:#3A2C1C; --pend-ink:var(--copper-500);
  --rose:#E98A7F; --rose-soft:#3A2321;
  --hdr:var(--forest-800); --hdr-ink:var(--cream-100); --hdr-muted:var(--forest-300);
  --sel-bg:var(--brand-mint); --sel-ink:var(--brand-ink);
  --sky1:var(--forest-800); --sky2:var(--forest-700); --ridge1:var(--forest-500); --ridge2:var(--forest-900); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.3;text-wrap:balance;margin:0}
h2{font-size:1.3rem}
h3{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{height:104px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.brand{display:flex;align-items:center;gap:10px;height:32px}
.brand b{font-family:var(--display);font-size:1.15rem}
.plaque{font-family:var(--mono);font-size:.7rem;border:1.5px solid var(--ink);border-radius:4px;padding:1px 5px;letter-spacing:.06em}
.brand .top-actions{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.brand b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand-home{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:left}
.brand-home .home-ic{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;border:1.5px solid var(--accent);color:var(--accent);flex:none}
.brand-home .home-ic .ic{width:18px;height:18px}
.nav-back{display:grid;place-items:center;width:34px;height:34px;margin-left:-6px;margin-right:-4px;border:0;border-radius:8px;background:none;color:inherit;cursor:pointer;flex:none}
.nav-back .ic{width:22px;height:22px;stroke-width:2.2}
.nav-back:focus-visible{outline:2px solid var(--accent)}
.brand .host-chip{white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;height:44px}
.tabs button{border:0;background:transparent;border-radius:10px;font-weight:500;color:var(--muted);cursor:pointer;position:relative}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--bg)}
.tabs .dot{position:absolute;top:6px;right:12%;width:7px;height:7px;border-radius:50%;background:var(--sun)}

main{padding-block:20px 40px}
section{display:flex;flex-direction:column;gap:12px}
.sections{display:flex;flex-direction:column;gap:34px}
.eyebrow{font-size:.75rem;letter-spacing:.12em;color:var(--muted);font-weight:600}

/* hero */
.hero{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;max-width:100%;background:linear-gradient(180deg,var(--sky1),var(--sky2))}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero-car{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.hero-car::-webkit-scrollbar{display:none}
.hc-slide{flex:0 0 100%;height:100%;margin:0;position:relative;scroll-snap-align:start;scroll-snap-stop:always}
.hc-slide button{display:block;width:100%;height:100%;padding:0;border:0;background:none;cursor:zoom-in}
.hc-slide figcaption{position:absolute;left:0;right:0;bottom:0;padding:30px 14px 30px;color:#fff;font-size:.88rem;line-height:1.4;background:linear-gradient(transparent,rgba(0,0,0,.6));text-align:left;pointer-events:none}
.hc-count{position:absolute;right:12px;top:12px;z-index:2;background:rgba(0,0,0,.5);color:#fff;font:600 .75rem/1 var(--mono,monospace);padding:5px 8px;border-radius:999px;pointer-events:none}
.hc-dots{position:absolute;left:0;right:0;bottom:10px;z-index:2;display:flex;justify-content:center;gap:4px;pointer-events:none;flex-wrap:wrap;padding:0 40px}
.hc-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5)}
.hc-dots i.on{background:#fff;width:14px;border-radius:3px}
.hero svg{position:absolute;inset:auto 0 0 0;width:100%;height:62%}
.hero .sun{position:absolute;width:22%;aspect-ratio:1;border-radius:50%;right:16%;top:14%;background:radial-gradient(circle,var(--sun) 0 45%,transparent 70%);opacity:.9}
.hero .frame{position:absolute;inset:0;border:10px solid var(--surface);border-radius:var(--r);pointer-events:none;opacity:.55}
.hero .mullion{position:absolute;top:0;bottom:0;left:50%;width:6px;background:var(--surface);opacity:.55}
.hero .floor{position:absolute;left:14px;top:14px;z-index:2;background:var(--surface);color:var(--ink);font-family:var(--mono);font-size:.78rem;padding:4px 8px;border-radius:6px}
.snow{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.snow i{position:absolute;top:-6px;width:4px;height:4px;border-radius:50%;background:#fff;opacity:.85;animation:fall linear infinite}
@keyframes fall{to{top:104%}}
@media (prefers-reduced-motion:reduce){.snow{display:none}}
.title-block{display:flex;flex-direction:column;gap:6px}
.title-block h1{font-size:1.75rem}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:.84rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
.btn.primary{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.danger{color:var(--rose);border-color:var(--rose)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.88rem;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.tabs button:focus-visible,.cal button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sun);outline-offset:2px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.notice{border-left:3px solid var(--sun);background:var(--surface);border-radius:6px var(--r) var(--r) 6px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
dl.kv{display:grid;grid-template-columns:7.5em 1fr;gap:10px 14px;margin:0}
dl.kv dt{color:var(--muted);font-size:.88rem}
dl.kv dd{margin:0;min-width:0}
ul.plain{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.gallery{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.gallery figure{margin:0;flex:0 0 78%;scroll-snap-align:start;display:flex;flex-direction:column;gap:4px}
.gallery button{padding:0;border:0;background:none;cursor:zoom-in;border-radius:10px;overflow:hidden;aspect-ratio:4/3;max-width:100%}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery figcaption{font-size:.84rem;color:var(--muted)}
.ph-group{display:flex;flex-direction:column;gap:8px}
.ph-hint{margin:-4px 0 14px}
.gallery button{position:relative}
.gallery .zoom{position:absolute;right:8px;bottom:8px;width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:rgba(5,8,12,.55);color:#fff;font-size:15px;line-height:1}
.lightbox .swipe-hint{color:#aab3bb;font-size:.8rem;margin:0}
.ph-group + .ph-group{margin-top:18px}
.ph-group h3{margin:0;font-size:1rem}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:center;gap:12px}
.cal-head b{min-width:8.2em;text-align:center}
.cal-head .btn{min-width:44px;min-height:40px;font-size:1.15rem}
.cal-head b{font-family:var(--display);font-size:1.15rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:.75rem;color:var(--muted);padding-bottom:2px}
.cal .wd:first-child{color:var(--rose)}
.cal button{aspect-ratio:1;max-width:100%;border:1px solid transparent;border-radius:10px;background:var(--surface);cursor:pointer;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;font-size:.95rem;position:relative}
.cal button small{font-size:.6rem;line-height:1;color:var(--muted)}
.cal .empty{visibility:hidden}
.cal button.past{background:transparent;color:var(--muted);opacity:.45;cursor:default}
.cal button.booked{background:#F2CC85;border-color:#DDA94A;color:#6E4510;text-decoration:line-through;cursor:not-allowed}
.cal button.booked small{color:#6E4510}
.cal button.pending{border:1.5px dashed var(--sun);color:var(--muted)}
.cal button.inrange{background:var(--sun-soft);border-radius:4px}
.cal button.sel{background:var(--sun);color:var(--sun-ink);font-weight:700;text-decoration:none}
.cal button.sel small{color:var(--sun-ink)}
.cal button.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cal .bars{position:absolute;left:4px;right:4px;bottom:4px;display:flex;flex-direction:column;gap:2px}
.cal .bars i{height:6px;border-radius:3px;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid var(--line);background:var(--surface)}
.sw.b{background:#F2CC85;border-color:#DDA94A}
.sw.p{border:1.5px dashed var(--sun)}
.sw.s{background:var(--sun);border-color:var(--sun)}
.selbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.selbar .grow b{font-variant-numeric:tabular-nums}

/* forms */
label.f{display:flex;flex-direction:column;gap:5px;font-size:.88rem;font-weight:500}
label.f span.opt{color:var(--muted);font-weight:400}
input[type=text],input[type=tel],input[type=email],input[type=password],input[type=number],input[type=url],input[type=date],select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
textarea{min-height:90px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--pine)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
details.privacy{font-size:.84rem;color:var(--muted)}
details.privacy summary{cursor:pointer}
.callout{background:var(--pine-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:.9rem}
.callout.warn{background:var(--sun-soft)}

/* status */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.pending{background:var(--sun-soft);color:var(--ink)}
.pill.confirmed{background:var(--pine-soft);color:var(--pine)}
.pill.declined,.pill.cancelled{background:var(--rose-soft);color:var(--rose)}
.pill.blocked{background:var(--line);color:var(--ink)}
.code-big{font-family:var(--mono);font-size:2rem;letter-spacing:.14em;text-align:center;padding:10px;background:var(--bg);border-radius:12px}
.secret{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--bg);border-radius:12px;padding:12px 14px}
.secret b{font-family:var(--mono);font-size:1.4rem;letter-spacing:.1em;word-break:break-all}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;counter-increment:s}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--sun-soft);display:grid;place-items:center;font-weight:600;font-size:.85rem}

/* checklist */
.checklist{display:flex;flex-direction:column;gap:2px}
.checklist label{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.checklist input{width:22px;height:22px;flex:none;accent-color:var(--pine);margin-top:1px}
.checklist input:checked + span{color:var(--muted);text-decoration:line-through}

/* admin */
.admin-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.admin-tabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500;cursor:pointer;font-size:.9rem}
.admin-tabs button[aria-current="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.stat span{font-size:.78rem;color:var(--muted)}
.bk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.bk.st-pending{border-left:4px solid #4F8FE0}
.bk.st-confirmed{border-left:4px solid #E3A13B}
.bk.st-blocked{border-left:4px solid #8E959C}
.bk .head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.bk .when{font-weight:600;font-variant-numeric:tabular-nums}
.bk .meta{font-size:.86rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.bk .msg{font-size:.9rem;background:var(--bg);border-radius:8px;padding:8px 10px;white-space:pre-wrap}
.ed-sec{display:flex;flex-direction:column;gap:10px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.ed-item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
.ed-item .fields{display:flex;flex-direction:column;gap:6px;min-width:0}
.ed-item .ops{display:flex;flex-direction:column;gap:4px}
.ed-item .ops button{width:36px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer}
.photo-ed{display:grid;grid-template-columns:84px 1fr auto;gap:10px;align-items:center}
.photo-ed img{width:84px;height:64px;object-fit:cover;border-radius:8px;display:block}
.savebar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;z-index:5}
pre.sql{max-height:220px;overflow:auto;background:var(--bg);border-radius:10px;padding:10px;font-size:.72rem;margin:0;white-space:pre}
.demo{background:var(--sun-soft);font-size:.82rem;text-align:center;padding-block:6px}

/* overlays */
.air-link{display:block;width:100%;text-align:right;border:0;background:none;padding:6px 0 10px;color:var(--accent,#2f6f62);font-size:.85rem;font-weight:600;cursor:pointer}
.trans-sec{margin:22px 0 8px;padding:9px 12px;border-radius:8px;background:var(--line);font-size:.98rem;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.trans-sec span{font-size:.78rem;font-weight:500;color:var(--muted)}
.trans-sec:first-child{margin-top:12px}
.trans-nav{position:sticky;top:-4px;z-index:1;display:flex;flex-wrap:wrap;gap:6px;margin:0 -20px;padding:10px 20px 10px;background:var(--surface);border-bottom:1px solid var(--line)}

.linked{display:flex;gap:10px;align-items:flex-start;background:var(--pine-soft);border-radius:12px;padding:10px 12px;font-size:.88rem}
.linked .ic{color:var(--pine)}
.chk{border-radius:10px;padding:10px 12px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.chk.warn{background:var(--pend-soft)}
.chk.ok{background:var(--pine-soft)}
@media (max-width:360px){.am-grid{grid-template-columns:1fr 1fr}}

/* my booking: ticket + progress */
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.ticket-top{background:var(--hdr);color:var(--hdr-ink);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.ticket-top .row{justify-content:space-between}
.ticket-dates{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.ticket-dates .lbl{font-size:.72rem;color:var(--hdr-muted);letter-spacing:.08em}
.ticket-dates b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:600;line-height:1.15}
.ticket-dates .nights{font-family:var(--display);font-size:.95rem;font-weight:600;color:var(--brand-mint);text-align:center;justify-self:center;padding:4px 12px;border:1px solid rgba(150,205,176,.35);border-radius:999px;white-space:nowrap}
.ticket-dates b .mon{font-size:.72em;letter-spacing:.06em;opacity:.85}
.ticket .cal-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ticket-dates .out{text-align:right}
.ticket-body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.dday{font-family:var(--display);font-weight:700;color:var(--accent)}
.progress{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.progress li{display:flex;flex-direction:column;gap:6px;font-size:.74rem;color:var(--muted);text-align:center;line-height:1.3}
.progress li::before{content:"";height:5px;border-radius:3px;background:var(--line)}
.progress li.done::before{background:var(--brand-sage)}
.progress li.now::before{background:var(--brand-copper)}
.progress li.done,.progress li.now{color:var(--ink);font-weight:600}
.next{background:var(--bg);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.next .eyebrow{color:var(--muted)}
.saved-list{display:flex;flex-direction:column;gap:8px}
.saved-item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.saved-item b{font-family:var(--mono);letter-spacing:.06em}
.saved-item .arrow{margin-left:auto;color:var(--muted)}
.saved-item .si-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.saved-item .pill{margin-left:auto}
.saved-item .pill + .arrow{margin-left:0}
.saved-item .si-dates{font-size:.85rem;color:var(--muted)}
.saved-item.off{opacity:.6;border-style:dashed}
.saved-item.off b{text-decoration:line-through}
.ticket .pill{background:rgba(150,205,176,.18);color:var(--brand-mint)}
.ticket .pill.confirmed{background:var(--brand-cream);color:var(--brand-ink);font-weight:700;font-size:.85rem;padding:4px 14px}
.ticket .pill.pending{background:rgba(193,141,82,.22);color:var(--cream-300)}
.ticket .pill.declined,.ticket .pill.cancelled{background:rgba(233,138,127,.2);color:#F3B7AE}

ot null default '',\n  status text not null default 'pending'\n    check (status in ('pending','confirmed','declined','cancelled','blocked')),\n  admin_note text not null default '',\n  created_at timestamptz default now(),\n  updated_at timestamptz default now(),\n  check (check_out > check_in)\n);\n-- 확정·호스트 사용 날짜만 서로 겹칠 수 없음 (신청 중인 날짜는 대기 신청 가능)\nalter table stay_bookings drop constraint if exists stay_no_overlap;\nalter table stay_bookings add constraint stay_no_overlap exclude using gist (daterange(check_in, check_out) with &&)\n  where (status in ('confirmed','blocked'));\nalter table stay_bookings add column if not exists checks jsonb not null default '{}'::jsonb;\nalter table stay_bookings add column if not exists checks_at timestamptz;\n-- 앞 순위가 확정된 뒤 대기 손님의 선택 ('' = 아직, 'wait' = 계속 기다리기)\nalter table stay_bookings add column if not exists wait_choice text not null default '';\nalter table stay_bookings enable row level security;\ndrop policy if exists \"stay bookings admin\" on stay_bookings;\ncreate policy \"stay bookings admin\" on stay_bookings for all using (stay_is_admin()) with check (stay_is_admin());\n\n-- 4) 비밀 정보 (출입 비번, 와이파이, 호수) — 관리자만\ncreate table if not exists stay_secret (\n  id int primary key default 1 check (id = 1),\n  door_code text not null default '',\n  wifi_name text not null default '',\n  wifi_pw text not null default '',\n  private_guide text not null default '',\n  show_in_app boolean not null default false,\n  updated_at timestamptz default now()\n);\ninsert into stay_secret (id) values (1) on conflict do nothing;\nalter table stay_secret add column if not exists building_code text not null default '';\nalter table stay_secret add column if not exists pay jsonb not null default '{}'::jsonb;\nalter table stay_secret enable row level security;\ndrop policy if exists \"stay secret admin\" on stay_secret;\ncreate policy \"stay secret admin\" on stay_secret for all using (stay_is_admin()) with check (stay_is_admin());\n\n-- 5) 손님용 기능 (이름·연락처는 절대 내보내지 않음)\ncreate or replace function stay_busy_dates()\nreturns table (check_in date, check_out date, status text)\nlanguage sql stable security definer set search_path = public as $$\n  select b.check_in, b.check_out,\n         case when b.status = 'pending' then 'pending' else 'booked' end\n  from stay_bookings b\n  where b.status in ('pending','confirmed','blocked')\n    and b.check_out >= (now() at time zone 'Asia/Seoul')::date - 1\n$$;\n\ncreate or replace function stay_request(\n  p_name text, p_phone text, p_kakao text, p_guests int,\n  p_in date, p_out date, p_message text)\nreturns json language plpgsql security definer set search_path = public as $$\ndeclare\n  v_today date := (now() at time zone 'Asia/Seoul')::date;\n  v_max int; v_maxn int; v_minn int; v_digits text; v_code text := '';\n  v_abc text := 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; i int; v_q int;\nbegin\n  select coalesce((data->>'maxGuests')::int, 2), coalesce((data->>'maxNights')::int, 90),\n         coalesce((data->>'minNights')::int, 1)\n    into v_max, v_maxn, v_minn from stay_content where id = 1;\n  v_digits := regexp_replace(coalesce(p_phone, ''), '\\D', '', 'g');\n  if length(trim(coalesce(p_name, ''))) < 1 or length(p_name) > 40 then raise exception 'bad_name'; end if;\n  if length(v_digits) < 9 or length(v_digits) > 13 then raise exception 'bad_phone'; end if;\n  if p_in < v_today or p_out <= p_in or p_in > v_today + 400\n     or (p_out - p_in) > v_maxn or (p_out - p_in) < v_minn then raise exception 'bad_dates'; end if;\n  if p_guests < 1 or p_guests > v_max then raise exception 'bad_guests'; end if;\n  if (select count(*) from stay_bookings where phone = v_digits and status = 'pending') >= 3 then\n    raise exception 'too_many';\n  end if;\n  if exists (select 1 from stay_bookings where status in ('confirmed','blocked')\n             and daterange(check_in, check_out) && daterange(p_in, p_out)) then\n    raise exception 'overlap';\n  end if;\n  select 1 + count(*) into v_q from stay_bookings\n   where status = 'pending' and daterange(check_in, check_out) && daterange(p_in, p_out);\n  for i in 1..8 loop\n    v_code := v_code || substr(v_abc, 1 + floor(random() * length(v_abc))::int, 1);\n  end loop;\n  begin\n    insert into stay_bookings (code, name, phone, kakao, guests, check_in, check_out, message)\n    values (v_code, trim(p_name), v_digits, left(coalesce(p_kakao, ''), 40), p_guests,\n            p_in, p_out, left(coalesce(p_message, ''), 500));\n  exception when exclusion_violation then\n    raise exception 'overlap';\n  end;\n  return json_build_object('code', v_code, 'check_in', p_in, 'check_out', p_out, 'status', 'pending', 'queue', v_q);\nend $$;\n\n-- 예약코드 + 휴대폰 뒤 4자리로 조회. '앱에서 보여주기'가 켜져 있으면 확정 + 입실 전날~퇴실 날에만 비번 공개\ncreate or replace function stay_lookup(p_code text, p_last4 text)\nreturns json language plpgsql security definer set search_path = public as $$\ndeclare\n  v_today date := (now() at time zone 'Asia/Seoul')::date;\n  b stay_bookings%rowtype; s stay_secret%rowtype; r jsonb;\nbegin\n  select * into b from stay_bookings\n   where code = upper(trim(p_code)) and right(phone, 4) = trim(p_last4) and status <> 'blocked';\n  if not found then return null; end if;\n  r := jsonb_build_object('code', b.code, 'name', b.name, 'guests', b.guests,\n        'check_in', b.check_in, 'check_out', b.check_out, 'status', b.status, 'checks', b.checks);\n  if b.status = 'pending' then\n    r := r || jsonb_build_object('queue', 1 + (select count(*) from stay_bookings x\n      where x.status = 'pending' and x.id <> b.id and x.created_at < b.created_at\n        and daterange(x.check_in, x.check_out) && daterange(b.check_in, b.check_out)),\n      'ahead_confirmed', exists (select 1 from stay_bookings x\n        where x.status in ('confirmed','blocked') and daterange(x.check_in, x.check_out) && daterange(b.check_in, b.check_out)),\n      'wait_choice', b.wait_choice);\n  end if;\n  if b.status = 'confirmed' then\n    select * into s from stay_secret where id = 1;\n    if not coalesce(s.show_in_app, false) then\n      r := r || jsonb_build_object('reveal_by_host', true);\n    elsif v_today between b.check_in - 1 and b.check_out then\n      r := r || jsonb_build_object('door_code', s.door_code, 'building_code', s.building_code, 'wifi_name', s.wifi_name,\n             'wifi_pw', s.wifi_pw, 'private_guide', s.private_guide);\n    end if;\n  end if;\n  return r::json;\nend $$;\n\ncreate or replace function stay_cancel(p_code text, p_last4 text)\nreturns boolean language plpgsql security definer set search_path = public as $$\ndeclare v_today date := (now() at time zone 'Asia/Seoul')::date; n int;\nbegin\n  update stay_bookings set status = 'cancelled', updated_at = now()\n   where code = upper(trim(p_code)) and right(phone, 4) = trim(p_last4)\n     and status in ('pending','confirmed') and check_in > v_today;\n  get diagnostics n = row_count;\n  return n > 0;\nend $$;\n\n-- 앞 순위 확정 후 '계속 기다리기' 선택 (신청 중인 본인 예약만)\ncreate or replace function stay_choose_wait(p_code text, p_last4 text)\nreturns boolean language plpgsql security definer set search_path = public as $$\ndeclare n int;\nbegin\n  update stay_bookings set wait_choice = 'wait', updated_at = now()\n   where code = upper(trim(p_code)) and right(phone, 4) = trim(p_last4) and status = 'pending';\n  get diagnostics n = row_count;\n  return n > 0;\nend $$;\n\n-- 퇴실 체크리스트 저장 (확정된 본인 예약만)\ncreate or replace function stay_save_checks(p_code text, p_last4 text, p_checks jsonb)\nreturns boolean language plpgsql security definer set search_path = public as $$\ndeclare n int;\nbegin\n  if pg_column_size(p_checks) > 2000 then return false; end if;\n  update stay_bookings set checks = coalesce(p_checks, '{}'::jsonb), checks_at = now()\n   where code = upper(trim(p_code)) and right(phone, 4) = trim(p_last4) and status = 'confirmed';\n  get diagnostics n = row_count;\n  return n > 0;\nend $$;\n\ngrant execute on function stay_save_checks(text,text,jsonb) to anon, authenticated;\ngrant execute on function stay_choose_wait(text,text) to anon, authenticated;\ngrant execute on function stay_busy_dates() to anon, authenticated;\ngrant execute on function stay_request(text,text,text,int,date,date,text) to anon, authenticated;\ngrant execute on function stay_lookup(text,text) to anon, authenticated;\ngrant execute on function stay_cancel(text,text) to anon, authenticated;\ngrant execute on function stay_claim_admin() to authenticated;\ngrant execute on function stay_is_admin() to anon, authenticated;\n\n-- 6) 사진 저장소 (누구나 보기, 관리자만 올리기/지우기)\ninsert into storage.buckets (id, name, public) values ('stay-photos', 'stay-photos', true)\non conflict (id) do nothing;\ndrop policy if exists \"stay photos insert\" on storage.objects;\ncreate policy \"stay photos insert\" on storage.objects for insert to authenticated\n  with check (bucket_id = 'stay-photos' and public.stay_is_admin());\ndrop policy if exists \"stay photos update\" on storage.objects;\ncreate policy \"stay photos update\" on storage.objects for update to authenticated\n  using (bucket_id = 'stay-photos' and public.stay_is_admin());\ndrop policy if exists \"stay photos delete\" on storage.objects;\ncreate policy \"stay photos delete\" on storage.objects for delete to authenticated\n  using (bucket_id = 'stay-photos' and public.stay_is_admin());\n\n-- 7) 자동 백업 — 매일 새벽 3시(한국 시간)에 내용과 예약을 복사해 30일 보관 (비밀번호 정보는 제외)\ncreate table if not exists stay_backups (\n  id bigint generated always as identity primary key,\n  created_at timestamptz default now(),\n  data jsonb not null\n);\nalter table stay_backups enable row level security;\ndrop policy if exists \"stay backups admin\" on stay_backups;\ncreate policy \"stay backups admin\" on stay_backups for select using (stay_is_admin());\n\ncreate or replace function stay_backup_now() returns bigint\nlanguage plpgsql security definer set search_path = public as $$\ndeclare v_id bigint;\nbegin\n  if auth.uid() is not null and not stay_is_admin() then raise exception 'not_admin'; end if;\n  insert into stay_backups (data)\n  select jsonb_build_object(\n    'content', (select data from stay_content where id = 1),\n    'bookings', coalesce((select jsonb_agg(to_jsonb(b) order by b.check_in) from stay_bookings b), '[]'::jsonb))\n  returning id into v_id;\n  delete from stay_backups where created_at < now() - interval '30 days';\n  return v_id;\nend $$;\nrevoke execute on function stay_backup_now() from public, anon;\ngrant execute on function stay_backup_now() to authenticated;\n\ndo $$\nbegin\n  create extension if not exists pg_cron;\n  perform cron.unschedule('stay-daily-backup') where exists (select 1 from cron.job where jobname = 'stay-daily-backup');\n  perform cron.schedule('stay-daily-backup', '0 18 * * *', 'select public.stay_backup_now()');\nexception when others then\n  raise notice '자동 백업 예약을 건너뜀 (pg_cron 사용 불가). 앱의 \"지금 백업\" 버튼은 그대로 쓸 수 있어요.';\nend $$;\n\n-- 8) 호스트 여러 명 — 호스트가 다른 사람의 이메일을 호스트로 추가/삭제\ncreate or replace function stay_add_admin(p_email text) returns boolean\nlanguage plpgsql security definer set search_path = public, auth as $$\ndeclare v uuid;\nbegin\n  if not stay_is_admin() then raise exception 'not_admin'; end if;\n  select id into v from auth.users where lower(email) = lower(trim(p_email));\n  if v is null then raise exception 'no_user'; end if;\n  insert into stay_admins (user_id) values (v) on conflict do nothing;\n  return true;\nend $$;\n\ncreate or replace function stay_list_admins() returns table (email text, me boolean)\nlanguage sql stable security definer set search_path = public, auth as $$\n  select u.email::text, u.id = auth.uid()\n  from stay_admins a join auth.users u on u.id = a.user_id\n  where stay_is_admin()\n  order by a.created_at\n$$;\n\ncreate or replace function stay_remove_admin(p_email text) returns boolean\nlanguage plpgsql security definer set search_path = public, auth as $$\ndeclare v uuid;\nbegin\n  if not stay_is_admin() then raise exception 'not function fmtD(s){ if(!s) return ""; const d = new Date(s+"T00:00:00Z"); return `${d.getUTCMonth()+1}.${d.getUTCDate()}(${WD[d.getUTCDay()]})`; }
function fmtDY(s){ const d = new Date(s+"T00:00:00Z"); return `${d.getUTCFullYear()}.${d.getUTCMonth()+1}.${d.getUTCDate()}(${WD[d.getUTCDay()]})`; }
function fmtPhone(p){ const d = String(p||"").replace(/\D/g,""); if(d.length===11) return d.replace(/(\d{3})(\d{4})(\d{4})/,"$1-$2-$3"); if(d.length===10) return d.replace(/(\d{3})(\d{3})(\d{4})/,"$1-$2-$3"); return d; }
function shiftMonth(ym,n){ const [y,m] = ym.split("-").map(Number); return new Date(Date.UTC(y,m-1+n,1)).toISOString().slice(0,7); }
function monthCells(ym){
  const [y,m] = ym.split("-").map(Number);
  const start = new Date(Date.UTC(y,m-1,1)).getUTCDay();
  const days = new Date(Date.UTC(y,m,0)).getUTCDate();
  const cells = [];
  for(let i=0;i<start;i++) cells.push(null);
  for(let d=1; d<=days; d++) cells.push(`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`);
  while(cells.length % 7) cells.push(null);
  return cells;
}
function getPath(o,p){ return p.split(".").reduce((a,k)=> a==null ? a : a[k], o); }
function setPath(o,p,v){ const ks = p.split("."); const last = ks.pop(); const t = ks.reduce((a,k)=> a[k], o); t[last] = v; }
function uid(){ return Math.random().toString(36).slice(2,9); }
function appUrl(){ try{ return location.href.split("#")[0].split("?")[0]; }catch(e){ return ""; } }

let toastTimer;
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(()=> t.hidden = true, 2600); }
async function copy(text, done="복사했어요"){
  try{ await navigator.clipboard.writeText(text); toast(done); }
  catch(e){ S.dialog = { title:"아래 내용을 길게 눌러 복사하세요", copyText:text, okLabel:"닫기", noCancel:true }; render(); }
}

function errMsg(e){
  const m = String((e && e.message) || e);
  for(const k in ERR) if(m.includes(k)) return ERR[k];
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return "인터넷 연결을 확인해 주세요.";
  if(/no_user/.test(m)) return "그 이메일로 만든 계정이 없어요. 먼저 앱에서 '계정 만들기'를 해 달라고 하세요.";
  if(/cannot_remove/.test(m)) return "본인은 호스트에서 뺄 수 없어요.";
  if(/stay_no_overlap|exclusion/i.test(m)) return "이미 확정된 예약과 날짜가 겹쳐요.";
  if(/rate limit/i.test(m)) return "짧은 시간에 메일을 너무 많이 보냈어요. 한 시간쯤 뒤에 다시 해 주세요.";
  if(/Email not confirmed/i.test(m)) return "이메일 인증이 아직 안 됐어요. Gmail에서 Supabase 인증 메일의 링크를 누른 뒤 다시 로그인하세요.";
  if(/Invalid login/i.test(m)) return "이메일 또는 비밀번호가 맞지 않아요.";
  if(/already registered/i.test(m)) return "이미 있는 계정이에요. 로그인해 주세요.";
  if(/Password should be/i.test(m)) return "비밀번호는 6자 이상으로 해 주세요.";
  return m;
}

const LIVE = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY);

function liveApi(){
  const U = CONFIG.SUPABASE_URL.trim().replace(/\/$/,""), K = CONFIG.SUPABASE_KEY.trim();
  let sess = LS.get("stay_session", null);
  function setSess(j){
    sess = (j && j.access_token) ? {
      access_token:j.access_token, refresh_token:j.refresh_token,
      expires_at: j.expires_at || Math.floor(Date.now()/1000) + (j.expires_in || 3600),
      email: (j.user && j.user.email) || (sess && sess.email) || ""
    } : null;
    sess ? LS.set("stay_session", sess) : LS.del("stay_session");
  }
  async function refresh(){
    try{
      const r = await fetch(U+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:sess.refresh_token})});
      if(r.status === 400 || r.status === 401){ setSess(null); return; }
      if(!r.ok) return;
      setSess(await r.json());
    }catch(e){ /* 인터넷이 잠깐 끊긴 경우: 로그인은 그대로 유지 */ }
  }
  async function token(){
    if(!sess) return K;
    if(Date.now()/1000 > sess.expires_at - 60) await refresh();
    return sess ? sess.access_token : K;
  }
  async function req(path, {method="GET", body, headers={}} = {}){
    const t = await token();
    const isRaw = body instanceof Blob || typeof body === "string";
    const auth = /^eyJ/.test(t) ? {Authorization:"Bearer "+t} : {};
    const r = await fetch(U+path, {method, headers:{apikey:K, ...auth, "Content-Type":"application/json", ...headers},
      body: body === undefined ? undefined : (isRaw ? body : JSON.stringify(body))});
    const txt = await r.text(); let j = null;
    try{ j = txt ? JSON.parse(txt) : null; }catch(e){ j = txt; }
    if(!r.ok){ const m = (j && (j.message || j.msg || j.error_description || j.error)) || ("HTTP "+r.status); const err = new Error(m); err.status = r.status; throw err; }
    return j;
  }
  const rpc = (fn, args) => req("/rest/v1/rpc/"+fn, {method:"POST", body:args || {}});
  return {
    live:true,
    async getContent(){ const r = await req("/rest/v1/stay_content?id=eq.1&select=data"); return mergeContent(r && r[0] && r[0].data); },
    async saveContent(data){ await req("/rest/v1/stay_content?id=eq.1",{method:"PATCH",body:{data, updated_at:new Date().toISOString()},headers:{Prefer:"return=minimal"}}); },
    async busy(){ return await rpc("stay_busy_dates") || []; },
    async request(f){ return await rpc("stay_request",{p_name:f.name,p_phone:f.phone,p_kakao:f.kakao,p_guests:f.guests,p_in:f.check_in,p_out:f.check_out,p_message:f.message}); },
    async lookup(code,last4){ return await rpc("stay_lookup",{p_code:code,p_last4:last4}); },
    async cancel(code,last4){ return await rpc("stay_cancel",{p_code:code,p_last4:last4}); },
    async saveChecks(code,last4,checks){ return await rpc("stay_save_checks",{p_code:code,p_last4:last4,p_checks:checks}); },
    async chooseWait(code,last4){ return await rpc("stay_choose_wait",{p_code:code,p_last4:last4}); },
    session(){ return sess; },
    async login(email,pw){
      const r = await fetch(U+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify({email,password:pw})});
      const j = await r.json(); if(!r.ok) throw new Error(j.error_description || j.msg || j.message || "로그인 실패");
      setSess(j); return await rpc("stay_claim_admin");
    },
    async signup(email,pw){

  const active = b => ["pending","confirmed","blocked"].includes(b.status);

  const overlaps = (a,b,skip) => db.bookings.some(x => x.id !== skip && hard(x) && a < x.check_out && x.check_in < b);
  const queueOf = (bk) => 1 + db.bookings.filter(x => x.id !== bk.id && x.status === "pending" && (x.created_at||"") < (bk.created_at||"~") && bk.check_in < x.check_out && x.check_in < bk.check_out).length;

    async busy(){ const y = addDays(todayStr(),-1); return wait(db.bookings.filter(b => active(b) && b.check_out >= y).map(b => ({check_in:b.check_in,check_out:b.check_out,status:b.status==="pending"?"pending":"booked"}))); },
    async request(f){
      const c = mergeContent(db.content), t = todayStr(), n = diffDays(f.check_in,f.check_out), digits = String(f.phone).replace(/\D/g,"");
      if(!f.name.trim()) throw new Error("bad_name");
      if(digits.length < 9) throw new Error("bad_phone");
      if(f.check_in < t || n < c.minNights || n > c.maxNights) throw new Error("bad_dates");
      if(overlaps(f.check_in,f.check_out)) throw new Error("overlap");
      const abc = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let code = ""; for(let i=0;i<8;i++) code += abc[Math.floor(Math.random()*abc.length)];

      const queue = queueOf(nb); db.bookings.push(nb);

    async lookup(code,last4){
      const b = db.bookings.find(x => x.code === code.trim().toUpperCase() && x.phone.slice(-4) === last4.trim() && x.status !== "blocked");

      const t = todayStr();
      if(b.status === "pending"){ r.queue = queueOf(b); r.ahead_confirmed = overlaps(b.check_in,b.check_out,b.id); r.wait_choice = b.wait_choice||""; }
      if(b.status === "confirmed"){
        if(!db.secret.show_in_app) r.reveal_by_host = true;
        else if(t >= addDays(b.check_in,-1) && t <= b.check_out) Object.assign(r,{building_code:db.secret.building_code,door_code:db.secret.door_code,wifi_name:db.secret.wifi_name,wifi_pw:db.secret.wifi_pw,private_guide:db.secret.private_guide});
      }

    },
    async cancel(code,last4){
      const b = db.bookings.find(x => x.code === code.trim().toUpperCase() && x.phone.slice(-4) === last4.trim());
      if(!b || !["pending","confirmed"].includes(b.status) || b.check_in <= todayStr()) return wait(false);
      b.status = "cancelled"; save(); return wait(true);
    },
    async chooseWait(code,last4){
      const b = db.bookings.find(x => x.code === code.trim().toUpperCase() && x.phone.slice(-4) === last4.trim() && x.status === "pending");
      if(!b) return wait(false);
      b.wait_choice = "wait"; save(); return wait(true);
    },
    async saveChecks(code,last4,checks){
      const b = db.bookings.find(x => x.code === code.trim().toUpperCase() && x.phone.slice(-4) === last4.trim() && x.status === "confirmed");
      if(!b) return wait(false);
      b.checks = clone(checks); b.checks_at = new Date().toISOString(); save(); return wait(true);
    },
    session(){ return authed ? {email:"demo@host"} : null; },
    async login(){ authed = true; LS.set("stay_demo_auth", true); return wait(true); },
    async signup(){ authed = true; LS.set("stay_demo_auth", true); return wait(true); },

    async listBookings(){ return wait(db.bookings.slice().sort((a,b)=> a.check_in < b.check_in ? -1 : 1)); },
    async updateBooking(id,patch){
      const b = db.bookings.find(x => x.id === id); if(!b) throw new Error("없는 예약이에요");
      if(patch.status && ["confirmed","blocked"].includes(patch.status) && !hard(b) && overlaps(b.check_in,b.check_out,id)) throw new Error("overlap");
      Object.assign(b, patch); save(); return wait(true);
    },
    async block(ci,co,note){ if(overlaps(ci,co)) throw new Error("overlap"); db.bookings.push({id:uid(),code:"BLK"+uid(),name:"호스트 사용",phone:"",kakao:"",guests:1,check_in:ci,check_out:co,message:"",status:"blocked",admin_note:note||"",created_at:new Date().toISOString()}); save(); return wait(true); },
    async deleteBooking(id){ db.bookings = db.bookings.filter(x => x.id !== id); save(); return wait(true); },
    async getSecret(){ return wait(db.secret); },
    async saveSecret(s){ db.secret = Object.assign(clone(s), {pay: db.secret.pay || {}}); save(); return wait(true); },
    async savePushSub(){ return wait(true); },
    async delPushSub(){ return wait(true); },
    async savePay(pay){ db.secret.pay = clone(pay); save(); return wait(true); },
    async uploadPhoto(blob){ return new Promise((res,rej)=>{ const fr = new FileReader(); fr.onload = ()=> res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); }); },
    async listAdmins(){ return wait((db.admins||["demo@host"]).map((e,i)=>({email:e, me:i===0}))); },
    async addAdmin(email){ db.admins = db.admins || ["demo@host"]; if(!db.admins.includes(email)) db.admins.push(email); save(); return wait(true); },
    async removeAdmin(email){ db.admins = (db.admins||["demo@host"]).filter(e => e !== email || e === "demo@host"); save(); return wait(true); },
    async listBackups(){ return wait((db.backups||[]).map(b=>({id:b.id,created_at:b.created_at})).reverse()); },
    async getBackup(id){ const b = (db.backups||[]).find(x=>x.id===id); return wait(b && b.data); },

    reset(){ db = seed(); save(); }
  };
}

function setBusy(list){
  S.busy = list || [];
  const m = {}, q = {};
  for(const r of S.busy){ for(let d = r.check_in; d < r.check_out; d = addDays(d,1)){ if(r.status === "pending") q[d] = (q[d]||0) + 1; else m[d] = "booked"; } }
  S.busyMap = m; S.pendMap = q;
}
function lastDay(out){ return addDays(out,-1); }   // 저장은 '나간 다음 날'(배타적), 화면은 '마지막 날'
function unitOf(){ return Math.max(1, Number(S.content.unitNights)||28); }
function stepOf(){ return Math.max(1, Number(S.content.stepNights)||7); }
function weeksLabel(n){ return n % 7 === 0 ? `${n/7}주` : `${n}일`; }
function okLength(n){ const c = S.content, u = unitOf(); return n >= Math.max(u, c.minNights) && n <= c.maxNights && (n - u) % stepOf() === 0; }
function feeParts(n){
  const c = S.content, u = unitOf(), st = stepOf();
  if(n < u || (n - u) % st) return null;
  const extra = n - u, sets = Math.floor(extra / u), steps = (extra - sets*u) / st;
  return {fee:(Number(c.firstPrice)||0) + sets*(Number(c.nextPrice)||0) + steps*(Number(c.weekPrice)||0), sets};
}
function feeFor(n){ const f = feeParts(n); return f ? f.fee : null; }
// 예약별 실제 이용료: 호스트가 고친 금액(b.fee)이 있으면 그것, 없으면 가격표대로
function bookingFee(b){ return (b && b.fee !== null && b.fee !== undefined && b.fee !== "") ? Number(b.fee) : feeFor(diffDays(b.check_in, b.check_out)); }
function validCheckout(ci,d){ return okLength(diffDays(ci,d)) && rangeFree(ci,d,S.busyMap); }
function pendingIn(a,b){ let n = 0; for(let d=a; d<b; d=addDays(d,1)) n = Math.max(n, (S.pendMap||{})[d] || 0); return n; }
function rangeFree(a,b,map){ for(let d=a; d<b; d=addDays(d,1)) if(map[d]) return false; return true; }

    </div>
  </div>`;

function guestCell(d,t){
  const {in:ci, out:co} = S.sel, st = S.busyMap[d], pq = (S.pendMap||{})[d] || 0;
  const cls = [];
  let sub = "";
  if(d < t) cls.push("past");
  else if(st) cls.push("booked");
  else if(pq) cls.push("pending");
  if(d === t) cls.push("today");
  if(ci && d === ci){ cls.push("sel"); sub = "체크인"; }
  else if(co && d === lastDay(co)){ cls.push("sel"); sub = "체크아웃"; }
  else if(ci && co && d > ci && d < lastDay(co)) cls.push("inrange");
  else if(ci && d > ci && validCheckout(ci,addDays(d,1))){ cls.push("goal"); sub = weeksLabel(diffDays(ci,d)+1); }
  if(!sub && st && d >= t) sub = "확정";
  else if(!sub && pq && d >= t) sub = `대기 ${pq}`;
  const dd = Number(d.slice(8));
  return `<button class="${cls.join(" ")}" data-a="pick" data-d="${d}" aria-label="${fmtD(d)}${st?" 예약 확정":pq?` 신청 ${pq}건`:""}">${dd}${sub?`<small>${sub}</small>`:""}</button>`;
}

function smsButtons(b){
  const ct = S.content.contact, opts = [];

function guestPhoneIntl(ph){   // 손님 번호 → 국제 형식. 이상한 번호면 null
  const raw = String(ph||"").trim(), d = raw.replace(/\D/g,"");
  if(!d || /^(\d)\1+$/.test(d)) return null;                       // 0000… 같은 번호
  if(raw.startsWith("+")) return d.length >= 8 && d.length <= 15 ? "+"+d : null;
  if(/^01[016789]\d{7,8}$/.test(d)) return "+82" + d.slice(1);       // 한국 휴대폰
  if(/^821[016789]\d{7,8}$/.test(d)) return "+" + d;
  if(/^[2-9]\d{9}$/.test(d)) return "+1" + d;                       // 미국 10자리
  if(/^1[2-9]\d{9}$/.test(d)) return "+" + d;
  return null;
}
function intlPhone(ph, cc){
  let d = String(ph||"").replace(/[^0-9+]/g,"");
  if(d.startsWith("+")) return d;
  if(cc === "KR") return d.startsWith("82") ? "+"+d : "+82" + d.replace(/^0/,"");
  return d.length === 11 && d.startsWith("1") ? "+"+d : "+1" + d;
}

const MON_EN = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

function myResult(r){
  const n = diffDays(r.check_in,r.check_out), t = todayStr(), reveal = addDays(r.check_in,-1);

    ${b.status !== "blocked" ? `<div class="meta">
      <span>${b.phone ? `<a href="tel:${esc(b.phone)}">${esc(fmtPhone(b.phone))}</a>` : ""}</span>
      ${b.kakao ? `<span>카톡 ${esc(b.kakao)}</span>` : ""}
      <span class="mono">${esc(b.code)}</span>
      ${b.created_at ? `<span>신청 ${esc(new Date(b.created_at).toLocaleString("ko-KR",{timeZone:TZ,month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit"}))} (${ago(b.created_at)})</span>` : ""}
    </div>` : ""}
    ${held ? `<div class="small"><span class="muted">앞 순위 확정</span> ${esc(held.status==="blocked"?"호스트 사용":held.name)} · ${fmtD(held.check_in)} → ${fmtD(lastDay(held.check_out))}<br><b>${b.wait_choice==="wait"?"손님이 '계속 기다리기'를 골랐어요":"손님이 아직 고르지 않았어요"}</b></div>` : ""}

        ${st.missing.length ? `<ul class="plain small">${st.missing.map(x=>`<li>${esc(ckMain(x))}</li>`).join("")}</ul>${alert?`<button class="btn sm" data-a="msgRemind" data-id="${b.id}">확인 요청 카톡 문구 복사</button>`:""}` : `<span class="small">모두 체크했어요</span>`}</div>`; })() : ""}
    ${contactRow}

}
function hostBookings(){
  const a = S.admin, t = todayStr(), list = a.bookings;
  const pending = list.filter(b => b.status === "pending");
  const upcoming = list.filter(b => b.status === "confirmed" && b.check_out >= t);
  const staying = upcoming.filter(b => b.check_in <= t);
  const filters = [["active","진행 중"],["pending","대기 신청"],["past","지난 기록"],["all","전체"]];
  let shown;
  if(a.filter === "pending") shown = pending;
  else if(a.filter === "past") shown = list.filter(b => b.check_out < t || ["declined","cancelled"].includes(b.status)).reverse();
  else if(a.filter === "all") shown = list;
  else shown = list.filter(b => (["pending","confirmed","blocked"].includes(b.status) && b.check_out >= t) || needsCheckAlert(b));
  return `<div class="stack">
    ${(()=>{ const le = lastExport(); const days = le ? diffDays(le, todayStr()) : null; return (days === null || days >= 30) && list.length ? `<div class="callout"><b>${days === null ? "아직 백업 파일을 받은 적이 없어요." : `백업 파일을 받은 지 ${days}일 지났어요.`}</b> 서버 자동 백업과 별개로, 휴대폰에도 한 부 보관해 두세요. <button class="btn sm" data-a="exportJson" style="margin-top:6px">백업 파일 받기</button></div>` : ""; })()}
    ${list.filter(needsCheckAlert).length ? `<div class="callout warn"><b>퇴실 체크가 덜 된 예약이 ${list.filter(needsCheckAlert).length}건 있어요.</b> 아래 카드에서 빠진 항목을 확인하고 손님에게 카톡으로 알려 주세요.</div>` : ""}
    <div class="stats">
      <div class="stat"><b>${pending.length}</b><span>대기 신청</span></div>
      <div class="stat"><b>${staying.length}</b><span>사용 중</span></div>
      <div class="stat"><b>${upcoming.length - staying.length}</b><span>사용 예정</span></div>
    </div>
    <div class="row">${filters.map(([k,l]) => `<button class="btn sm ${a.filter===k?"dark":""}" data-a="hfilter" data-f="${k}">${l}</button>`).join("")}<button class="btn sm ghost" data-a="reloadAdmin">↻</button></div>
    ${shown.length ? shown.slice().sort((x,y)=>(y.status==="pending")-(x.status==="pending")).map(bookingCard).join("") : `<p class="muted">해당하는 예약이 없어요.</p>`}
  </div>`;
}
function adminMap(){
  const m = {};
  for(const b of S.admin.bookings){ if(!["pending","confirmed","blocked"].includes(b.status)) continue; for(let d=b.check_in; d<b.check_out; d=addDays(d,1)) (m[d] = m[d] || []).push(b); }
  return m;
}
function hostCalendar(){
  const a = S.admin, map = adminMap(), {in:ci,out:co} = a.sel;
  const col = {pending:"#4F8FE0", confirmed:"#E3A13B", blocked:"#8E959C"};
  const cell = (d,t) => {
    const items = map[d] || [], cls = [];
    if(d < t) cls.push("past");
    if(d === t) cls.push("today");
    if(ci && d === ci) cls.push("sel"); else if(co && d === lastDay(co)) cls.push("sel"); else if(ci && co && d > ci && d < lastDay(co)) cls.push("inrange");
    return `<button class="${cls.join(" ")}" data-a="hpick" data-d="${d}" style="justify-content:flex-start;padding-top:6px">${Number(d.slice(8))}<span class="bars">${items.slice(0,2).map(b=>`<i style="background:${col[b.status]}"></i>`).join("")}</span></button>`;
  };
  const ym = a.month, monthEnd = addDays(shiftMonth(ym,1)+"-01",-1);
  const inMonth = a.bookings.filter(b => ["pending","confirmed","blocked"].includes(b.status) && b.check_in <= monthEnd && b.check_out > ym+"-01");
  const free = ci && co && rangeFree(ci,co,Object.fromEntries(Object.keys(map).map(k=>[k,1])));
  return `<div class="stack">
    <div class="legend"><span><i class="sw" style="background:#4F8FE0;border-color:#4F8FE0"></i>대기 신청</span><span><i class="sw" style="background:#E3A13B;border-color:#E3A13B"></i>확정</span><span><i class="sw" style="background:#8E959C;border-color:#8E959C"></i>호스트 사용 (손님 안 받는 날)</span></div>
    ${calendar(ym,{navAction:"hmonth",cell,allowPast:true})}
    <div class="card">
      <h3>날짜 막기</h3>
      <p class="small muted">본인이 쓰거나 손님을 받지 않을 날을 막아요. 첫날과 마지막 날을 차례로 누르세요. 하루만 막으려면 같은 날을 두 번 누르세요.</p>
      <p>${ci ? `<b>${fmtD(ci)}</b> → <b>${co?fmtD(lastDay(co)):"마지막 날 선택"}</b>${ci&&co?` · ${diffDays(ci,co)}일`:""}` : `<span class="muted">선택 없음</span>`}</p>
      ${ci && co ? (free ? `<label class="f">메모 <span class="opt">(선택)</span><input type="text" id="blk-note" maxlength="60"></label><div class="row"><button class="btn dark" data-a="doBlock">이 날짜 막기</button><button class="btn ghost" data-a="hclear">취소</button></div>` : `<div class="callout warn">이미 예약이 있는 날이 포함돼 있어요.</div><button class="btn ghost" data-a="hclear">다시 고르기</button>`) : ""}
    </div>
    <h3>이번 달 일정</h3>
    ${inMonth.length ? inMonth.map(bookingCard).join("") : `<p class="muted small">이번 달 일정이 없어요.</p>`}
  </div>`;
}

function ops(path,i,len){

function listEd(path,kind,addLabel){
  const arr = getPath(S.admin.draft,path);
  const item = (x,i) => {

    else if(kind === "lv") f = `<input type="text" id="${id}-l" data-bind="${p}.label" value="${esc(x.label)}" placeholder="항목"><textarea id="${id}-v" data-bind="${p}.value" style="min-height:60px" placeholder="내용">${esc(x.value)}</textarea>`;
    else if(kind === "tb") f = `<input type="text" id="${id}-t" data-bind="${p}.title" value="${esc(x.title)}" placeholder="제목"><textarea id="${id}-b" data-bind="${p}.body" placeholder="내용">${esc(x.body)}</textarea>`;
    else if(kind === "proc") f = `<div class="row"><select id="${id}-s" data-bind="${p}.step" style="width:auto">${["apply","confirm","checkin","checkout","change","dot"].map(k=>`<option value="${k}" ${x.step===k?"selected":""}>${{apply:"신청",confirm:"확정",checkin:"입실",checkout:"퇴실",change:"변경",dot:"기타"}[k]} 아이콘</option>`).join("")}</select></div><input type="text" id="${id}-t" data-bind="${p}.title" value="${esc(x.title)}" placeholder="단계 이름"><textarea id="${id}-b" data-bind="${p}.body" placeholder="설명">${esc(x.body)}</textarea>`;
    else if(kind === "am") f = `<div class="row"><span class="am-prev">${icon(x.icon)}</span><select id="${id}-i" data-bind="${p}.icon" data-rerender="1" style="width:auto;flex:1">${Object.keys(ICONS).filter(k=>!["apply","confirm","checkin","checkout","change"].includes(k)).map(k=>`<option value="${k}" ${x.icon===k?"selected":""}>${k}</option>`).join("")}</select><select id="${id}-g" data-bind="${p}.group" style="width:auto;flex:1">${AM_GROUPS.map(g=>`<option ${x.group===g?"selected":""}>${g}</option>`).join("")}</select></div><input type="text" id="${id}-l" data-bind="${p}.label" value="${esc(x.label)}" placeholder="이름"><input type="text" id="${id}-n" data-bind="${p}.note" value="${esc(x.note||"")}" placeholder="작은 설명 (선택)">`;

    return `<div class="ed-item"><div class="fields">${f}</div>${ops(path,i,arr.length)}</div>`;
  };
  return `${arr.map(item).join("")}<button class="btn sm" data-a="ladd" data-p="${path}" data-k="${kind}">+ ${addLabel}</button>`;
}

    ${list.length ? years.map(y => { const ys = list.filter(b => b.check_in.startsWith(y)); return `<div class="rec-year">

    `SUMMARY:${c.name} 숙박`,`DESCRIPTION:예약코드 ${code}`,`LOCATION:남위례역`,
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:내일 체크인이에요","TRIGGER:-PT9H","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
}
function download(name,text,type){
  try{ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text],{type})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }
  catch(e){ toast("이 화면에서는 파일을 받을 수 없어요"); }
}
async function resizeImage(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = rej; i.src = url; });
    const max = LIVE ? 1600 : 900, k = Math.min(1, max / Math.max(img.width,img.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    return await new Promise(res => cv.toBlob(res,"image/jpeg",LIVE?.82:.7));
  } finally { URL.revokeObjectURL(url); }
}

S.fxBy = LS.get("stay_fx", {}) || {};
async function fetchFx(date){   // date: "YYYY-MM-DD" 또는 "latest"
  const key = date || "latest", today = todayStr();
  const hit = S.fxBy[key];
  if(hit && (key !== "latest" || hit.got === today)) return hit;
  const tries = [
    async () => { const r = await fetch(`https://api.frankfurter.app/${key}?from=USD&to=KRW`); const j = await r.json(); return {rate:j.rates.KRW, date:j.date}; },
    async () => { const r = await fetch(`https://api.frankfurter.dev/v1/${key}?base=USD&symbols=KRW`); const j = await r.json(); return {rate:j.rates.KRW, date:j.date}; },
    async () => { if(key !== "latest") throw 0; const r = await fetch("https://open.er-api.com/v6/latest/USD"); const j = await r.json(); return {rate:j.rates.KRW, date:today}; }
  ];
  for(const t of tries){ try{ const v = await t(); if(v && v.rate > 100){ v.got = today; S.fxBy[key] = v; LS.set("stay_fx", S.fxBy); return v; } }catch(e){} }
  return hit || null;
}
async function loadFx(){ const v = await fetchFx("latest"); if(v){ S.fx = v; render(); } }
function usdOf(manwon, fx){ fx = fx || S.fx; return fx && manwon ? Math.round(manwon * 10000 / fx.rate) : null; }
function fmtUsd(n){ return "$" + Number(n).toLocaleString("en-US"); }
function fxLine(fx){ fx = fx || S.fx; return fx ? `1 USD = ${Math.round(fx.rate).toLocaleString("ko-KR")}원 (${fx.date.replace(/-/g,".")} 표준 환율)` : ""; }

function backupList(){
  const b = S.admin.backups;
  if(b === undefined) return `<p class="small muted">백업 목록을 불러오는 중…</p>`;
  if(b === null) return `<p class="small muted">서버 백업 목록을 불러오지 못했어요. 설정 SQL을 최신으로 다시 실행해 주세요.</p>`;
  if(!b.length) return `<p class="small muted">아직 서버 백업이 없어요. '지금 백업'을 눌러 첫 백업을 만들어 보세요.</p>`;
  return `<div class="stack" style="gap:6px"><b class="small">서버 백업 ${b.length}개 · 최근 ${esc(new Date(b[0].created_at).toLocaleString("ko-KR",{timeZone:TZ,month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit"}))}</b>
    ${b.slice(0,5).map(x => `<div class="row small"><span class="grow">${esc(new Date(x.created_at).toLocaleString("ko-KR",{timeZone:TZ,year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit"}))}</span><button class="btn sm" data-a="dlBackup" data-id="${x.id}">파일로 받기</button><button class="btn sm ghost" data-a="restoreBackup" data-id="${x.id}">내용 복원</button></div>`).join("")}</div>`;
}

// 크게 본 사진: 손가락으로 좌우로 밀어 넘기기
let lbTx = null, lbTy = null;
document.addEventListener("touchstart", e => {
  if(S.lightbox === null || !e.target.closest(".lightbox") || e.target.closest(".lightbox.map")){ lbTx = null; return; }
  lbTx = e.touches[0].clientX; lbTy = e.touches[0].clientY;
}, {passive:true});
document.addEventListener("touchend", e => {
  if(lbTx === null || S.lightbox === null) return;
  const t = e.changedTouches[0], dx = t.clientX - lbTx, dy = t.clientY - lbTy; lbTx = null;
  if(Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy)) return;
  const n = S.lightbox + (dx < 0 ? 1 : -1);
  S.lbSwipeAt = Date.now();
  if(n >= 0 && n < allPhotos().length){ S.lightbox = n; render(); }
}, {passive:true});
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]");
  if(!el) return;
  const fn = A[el.dataset.a];
  if(!fn) return;
  if(el.tagName === "BUTTON" || (el.tagName === "DIV" && el.dataset.a !== "dlgBg" && el.dataset.a !== "lbClose")) e.preventDefault();
  fn(el, e);
});
document.addEventListener("scroll", e => {
  const hc = e.target; if(!hc || hc.id !== "heroCar") return;
  const k = Math.round(hc.scrollLeft / Math.max(1, hc.clientWidth));
  if(k === S.heroIdx) return; S.heroIdx = k;
  const cnt = document.getElementById("hcCount"), dots = document.getElementById("hcDots");
  if(cnt) cnt.textContent = `${k+1} / ${hc.children.length}`;
  if(dots) [...dots.children].forEach((d,i)=>d.classList.toggle("on", i===k));
}, true);
document.addEventListener("input", e => {
  const el = e.target;
  if(el.form && el.form.dataset.form && el.name && el.type !== "password") S.f[el.form.dataset.form+"."+el.name] = el.type === "checkbox" ? el.checked : el.value;
  if(el.dataset.bind && S.admin.draft){
    let v = el.type === "checkbox" ? el.checked : el.value;
    if(el.dataset.num) v = v === "" ? "" : Number(v);
    setPath(S.admin.draft, el.dataset.bind, v); markDirty();
    if(el.dataset.rerender) render();
  }
});
document.addEventListener("change", async e => {
  const el = e.target;
  if(el.name === "same" && el.form && el.form.dataset.form === "book"){ S.f["book.same"] = el.checked; render(); if(!el.checked) setTimeout(()=>document.getElementById("bf-sname")?.focus(), 50); return; }
  if(el.dataset.check !== undefined){
    const k = el.dataset.check, lk = S.linked;
    if(lk){
      lk.checks = Object.assign({}, lk.checks, {[k]: el.checked});
      if(!el.checked) delete lk.checks[k];
      if(S.my.result && S.my.result.code === lk.code) S.my.result.checks = lk.checks;
      render();
      try{ const ok = await api.saveChecks(lk.code, lk.last4, lk.checks); if(ok) toast("호스트에게 전달했어요"); else toast("저장하지 못했어요. 호스트에게 카톡으로 알려 주세요"); }
      catch(err){ toast(errMsg(err)); }
    } else { S.checks[k] = el.checked; LS.set("stay_checks", S.checks); render(); }
    return;
  }
  if(el.dataset.a2 === "toggleNotify"){
    if(el.checked && "Notification" in window){
      try{ const p = await Notification.requestPermission(); if(p !== "granted"){ el.checked = false; toast("알림이 허용되지 않았어요. 브라우저 설정에서 허용해 주세요"); return; } }
      catch(err){ el.checked = false; toast("이 화면에서는 알림을 켤 수 없어요"); return; }
    }
    S.admin.notify = el.checked; LS.set("stay_notify", el.checked); return;
  }
  if(el.id === "ph-up" && el.files && el.files.length){
    const d = ensureDraft(); S.admin.busy = true; render();
    try{ for(const f of el.files){ const blob = await resizeImage(f); const url = await api.uploadPhoto(blob); d.photos.push({url, caption:""}); } markDirty(); toast("사진을 올렸어요. 저장을 눌러 주세요"); }
    catch(err){ toast("사진을 올리지 못했어요: " + errMsg(err)); }
    S.admin.busy = false; render();
  }
});
document.addEventListener("submit", async e => {
  const f = e.target; if(!f.dataset.form) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(f).entries());
  const kind = f.dataset.form;
  if(kind === "book"){
    if(v.website) return;
    if(!v.name.trim()){ toast("이름을 입력해 주세요"); return; }
    if(!guestPhoneIntl(v.phone)){ toast("연락 가능한 휴대폰 번호를 정확히 적어 주세요 (한국 010… 또는 미국 번호)"); document.getElementById("bf-phone")?.focus(); return; }
    const same = !(f.same && !f.same.checked);
    if(!same && !(v.sname||"").trim()){ toast("머무시는 분 이름을 적어 주세요"); document.getElementById("bf-sname")?.focus(); return; }
    if(!same && (v.sphone||"").trim() && !guestPhoneIntl(v.sphone)){ toast("머무시는 분 휴대폰 번호를 확인해 주세요"); document.getElementById("bf-sphone")?.focus(); return; }
    if(!same) v.message = `🏠 머무시는 분: ${v.sname.trim()}${(v.srel||"").trim()?` (${v.srel.trim()})`:""}${(v.sphone||"").trim()?` · ${v.sphone.trim()}`:""}` + (v.message.trim() ? "\n" + v.message : "");
    if(!f.rules.checked){ toast("'이용 안내 및 퇴실 전 지켜주셔야 할 사항'에 동의해 주세요"); document.getElementById("must")?.scrollIntoView({behavior:"smooth",block:"start"}); return; }
    S.sending = true; render();
    try{
      const r = await api.request({name:v.name.trim(), phone:v.phone, kakao:v.kakao.trim(), guests:Number(v.guests), check_in:S.sel.in, check_out:S.sel.out, message:v.message.trim()});
      const last4 = v.phone.replace(/\D/g,"").slice(-4);
      S.submitted = Object.assign({}, r, {name:v.name.trim()}); S.notifyModal = true;
      rememberMy(r.code,last4,r); S.my.code = r.code; S.my.last4 = last4;
      S.sel = {in:null,out:null}; Object.keys(S.f).forEach(k => { if(k.startsWith("book.")) delete S.f[k]; }); loadBusy(); window.scrollTo(0,0);
    }catch(err){
      toast(errMsg(err));
      if(String(err.message).includes("overlap")){ S.sel = {in:null,out:null}; loadBusy(); }
    }
    S.sending = false; render();
  }
  if(kind === "lookup"){
    const code = (v.code||"").trim().toUpperCase(), last4 = (v.last4||"").replace(/\D/g,"");
    if(!code || last4.length !== 4){ toast("예약코드와 뒤 4자리를 입력해 주세요"); return; }
    openFromList(); doLookup(code,last4);
  }
  if(kind === "login" || kind === "signup"){
    const a = S.admin; a.busy = true; a.err = ""; render();
    try{
      const ok = kind === "login" ? await api.login(v.email.trim(), v.pw) : await api.signup(v.email.trim(), v.pw);
      if(!ok){ api.logout(); S.dialog = {title:"아직 호스트로 등록되지 않은 계정이에요", body:`계정은 만들어졌어요. 기존 호스트에게 '설정 → 호스트'에서 이 이메일(${v.email.trim()})을 추가해 달라고 하신 뒤 다시 로그인하세요.`, okLabel:"확인", noCancel:true}; }
      else { a.authed = true; a.lastPending = null; LS.set("stay_host_email", v.email.trim()); await loadAdmin(); }
    }catch(err){ a.err = errMsg(err); }
    a.busy = false; render();
  }
  if(kind === "pay"){
    const pay = {kr:(v.kr||"").trim(), zelle:(v.zelle||"").trim(), venmo:(v.venmo||"").trim(), paypal:(v.paypal||"").trim()};
    try{ await api.savePay(pay); S.admin.secret = Object.assign({}, S.admin.secret||{}, {pay}); if(pay.kr) LS.set("stay_bank", pay.kr); toast("입금 정보를 저장했어요"); render(); }
    catch(err){ toast(/pay/.test(err.message||"") ? "서버 SQL 업데이트가 먼저 필요해요" : errMsg(err)); }
  }
  if(kind === "secret"){
    const s = {building_code:v.building_code||"", door_code:v.door_code||"", wifi_name:v.wifi_name||"", wifi_pw:v.wifi_pw||"", private_guide:v.private_guide||"", show_in_app:f.show_in_app.checked};
    try{ await api.saveSecret(s); const need = s.needSql; delete s.needSql; if(S.admin.secret && "pay" in S.admin.secret) s.pay = S.admin.secret.pay; S.admin.secret = need ? Object.fromEntries(Object.entries(s).filter(([k])=>k!=="building_code")) : s; toast(need ? "저장했어요. 단, 건물 비밀번호는 서버 SQL 업데이트 후에 저장돼요" : "저장했어요"); }catch(err){ toast(errMsg(err)); }
  }
});

window.addEventListener("popstate", () => {
  const keep = () => { try{ history.pushState(null,"","#"+S.view); }catch(e){} };
  if(S.dialog){ let f = null; if(!S.dialog.noCancel){ f = S.dialog.onCancel; S.dialog = null; } keep(); render(); if(f) f(); return; }
  S.navDepth = Math.max(0, (S.navDepth||0) - 1);
  if(S.view === "my" && S.my.fromList && viewFromHash() === "my"){ closeResult(); return; }
  S.my.fromList = false;
  const v = viewFromHash(); if(v !== S.view) go(v, true);
});
// 다른 화면으로 바로 들어와도 뒤로가기를 누르면 처음 화면으로 가도록
try{ if(S.view !== "home"){ history.replaceState(null,"","#home"); history.pushState(null,"","#"+S.view); } }catch(e){}
window.addEventListener("beforeunload", e => { if(S.admin.dirty){ e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("keydown", e => {
  if(S.mapOpen && e.key === "Escape"){ S.mapOpen = false; render(); }
  if(S.lightbox !== null){ if(e.key === "Escape"){ S.lightbox = null; render(); } if(e.key === "ArrowRight" && S.lightbox < allPhotos().length-1){ S.lightbox++; render(); } if(e.key === "ArrowLeft" && S.lightbox > 0){ S.lightbox--; render(); } }
  else if(S.dialog && e.key === "Escape" && !S.dialog.noCancel){ S.dialog = null; render(); }
});
setInterval(() => { if(S.admin.authed && !S.dialog && !S.admin.dirty) loadAdmin(true); }, 30000);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && S.admin.authed) loadAdmin(true); });
setInterval(() => { if(S.view === "book" && !S.submitted && !S.sending) loadBusy(); }, 60000);

/* ---------- boot ---------- */
(async function boot(){
  await loadContent();
  loadFx();
  if(S.view === "book") loadBusy();
  if(S.view === "host") enterHost();
  else if(api.session()) enterHost();
  if(S.view === "my") autoMy();
  if(S.view === "guide") autoLink();
})();
})();
</script>
