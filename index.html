<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E0952A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="남위례역 도보 2분, 햇살 가득한 15층 오피스텔 단기 숙박 예약">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>남위례 햇살집</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: forest header band, cream ground, white cards; mint = action, copper = rare accent (ConvoTrans system) */
:root{
  /* ConvoTrans brand anchors */
  --brand-cream:#EEE8B2; --brand-copper:#C18D52; --brand-ink:#081B1B;
  --brand-forest:#203B37; --brand-sage:#5A8F76; --brand-mint:#96CDB0;
  /* ramps */
  --mint-50:#EEF8F2; --mint-100:#DDF0E5; --mint-300:#96CDB0; --mint-500:#5A8F76; --mint-700:#3E6E59; --mint-900:#173A2E;
  --forest-50:#EEF3F1; --forest-100:#DCE6E3; --forest-300:#8FA8A2; --forest-400:#5B6F6A; --forest-500:#3B5F58;
  --forest-700:#203B37; --forest-800:#0F2826; --forest-900:#081B1B;
  --cream-50:#FBF9EE; --cream-100:#F6F2D6; --cream-200:#E7E4CC; --cream-300:#EEE8B2;
  --copper-100:#F4E7D6; --copper-500:#C18D52; --copper-700:#8E6232;
  --white:#FFFFFF; --red-500:#B3433A; --red-100:#F7E0DC;

  /* semantic (light) */
  --bg:var(--cream-50); --surface:var(--white); --ink:var(--brand-ink); --muted:var(--forest-400); --line:var(--cream-200);
  --sun:var(--brand-mint); --sun-ink:var(--brand-ink); --sun-soft:var(--mint-100);
  --pine:var(--mint-700); --pine-soft:var(--mint-100);
  --pend:var(--copper-500); --pend-soft:var(--copper-100); --pend-ink:var(--copper-700);
  --rose:var(--red-500); --rose-soft:var(--red-100);
  --hdr:var(--brand-forest); --hdr-ink:var(--cream-100); --hdr-muted:var(--forest-300);
  --sel-bg:var(--brand-forest); --sel-ink:var(--cream-100);
  --accent:var(--brand-copper);
  --sky1:var(--cream-100); --sky2:var(--brand-cream); --ridge1:var(--brand-sage); --ridge2:var(--brand-forest);

  --display:"Chakra Petch","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --body:"Plus Jakarta Sans","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:var(--forest-900); --surface:var(--forest-800); --ink:var(--cream-100); --muted:var(--forest-300); --line:var(--forest-700);
  --sun:var(--brand-mint); --sun-ink:var(--brand-ink); --sun-soft:var(--mint-900);
  --pine:var(--mint-300); --pine-soft:var(--mint-900);
  --pend:var(--copper-500); --pend-soft:#3A2C1C; --pend-ink:var(--copper-500);
  --rose:#E98A7F; --rose-soft:#3A2321;
  --hdr:var(--forest-800); --hdr-ink:var(--cream-100); --hdr-muted:var(--forest-300);
  --sel-bg:var(--brand-mint); --sel-ink:var(--brand-ink);
  --sky1:var(--forest-800); --sky2:var(--forest-700); --ridge1:var(--forest-500); --ridge2:var(--forest-900); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:var(--forest-900); --surface:var(--forest-800); --ink:var(--cream-100); --muted:var(--forest-300); --line:var(--forest-700);
  --sun:var(--brand-mint); --sun-ink:var(--brand-ink); --sun-soft:var(--mint-900);
  --pine:var(--mint-300); --pine-soft:var(--mint-900);
  --pend:var(--copper-500); --pend-soft:#3A2C1C; --pend-ink:var(--copper-500);
  --rose:#E98A7F; --rose-soft:#3A2321;
  --hdr:var(--forest-800); --hdr-ink:var(--cream-100); --hdr-muted:var(--forest-300);
  --sel-bg:var(--brand-mint); --sel-ink:var(--brand-ink);
  --sky1:var(--forest-800); --sky2:var(--forest-700); --ridge1:var(--forest-500); --ridge2:var(--forest-900); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.3;text-wrap:balance;margin:0}
h2{font-size:1.3rem}
h3{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{height:104px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.brand{display:flex;align-items:center;gap:10px;height:32px}
.brand b{font-family:var(--display);font-size:1.15rem}
.plaque{font-family:var(--mono);font-size:.7rem;border:1.5px solid var(--ink);border-radius:4px;padding:1px 5px;letter-spacing:.06em}
.brand .top-actions{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.brand b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand .host-chip{white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;height:44px}
.tabs button{border:0;background:transparent;border-radius:10px;font-weight:500;color:var(--muted);cursor:pointer;position:relative}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--bg)}
.tabs .dot{position:absolute;top:6px;right:12%;width:7px;height:7px;border-radius:50%;background:var(--sun)}

main{padding-block:20px 40px}
section{display:flex;flex-direction:column;gap:12px}
.sections{display:flex;flex-direction:column;gap:34px}
.eyebrow{font-size:.75rem;letter-spacing:.12em;color:var(--muted);font-weight:600}

/* hero */
.hero{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;max-width:100%;background:linear-gradient(180deg,var(--sky1),var(--sky2))}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero svg{position:absolute;inset:auto 0 0 0;width:100%;height:62%}
.hero .sun{position:absolute;width:22%;aspect-ratio:1;border-radius:50%;right:16%;top:14%;background:radial-gradient(circle,var(--sun) 0 45%,transparent 70%);opacity:.9}
.hero .frame{position:absolute;inset:0;border:10px solid var(--surface);border-radius:var(--r);pointer-events:none;opacity:.55}
.hero .mullion{position:absolute;top:0;bottom:0;left:50%;width:6px;background:var(--surface);opacity:.55}
.hero .floor{position:absolute;left:14px;bottom:14px;background:var(--surface);color:var(--ink);font-family:var(--mono);font-size:.78rem;padding:4px 8px;border-radius:6px}
.snow{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.snow i{position:absolute;top:-6px;width:4px;height:4px;border-radius:50%;background:#fff;opacity:.85;animation:fall linear infinite}
@keyframes fall{to{top:104%}}
@media (prefers-reduced-motion:reduce){.snow{display:none}}
.title-block{display:flex;flex-direction:column;gap:6px}
.title-block h1{font-size:1.75rem}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:.84rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
.btn.primary{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.danger{color:var(--rose);border-color:var(--rose)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.88rem;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.tabs button:focus-visible,.cal button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sun);outline-offset:2px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.notice{border-left:3px solid var(--sun);background:var(--surface);border-radius:6px var(--r) var(--r) 6px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
dl.kv{display:grid;grid-template-columns:7.5em 1fr;gap:10px 14px;margin:0}
dl.kv dt{color:var(--muted);font-size:.88rem}
dl.kv dd{margin:0;min-width:0}
ul.plain{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.gallery{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.gallery figure{margin:0;flex:0 0 78%;scroll-snap-align:start;display:flex;flex-direction:column;gap:4px}
.gallery button{padding:0;border:0;background:none;cursor:zoom-in;border-radius:10px;overflow:hidden;aspect-ratio:4/3;max-width:100%}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery figcaption{font-size:.84rem;color:var(--muted)}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-head b{font-family:var(--display);font-size:1.15rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:.75rem;color:var(--muted);padding-bottom:2px}
.cal .wd:first-child{color:var(--rose)}
.cal button{aspect-ratio:1;max-width:100%;border:1px solid transparent;border-radius:10px;background:var(--surface);cursor:pointer;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;font-size:.95rem;position:relative}
.cal button small{font-size:.6rem;line-height:1;color:var(--muted)}
.cal .empty{visibility:hidden}
.cal button.past{background:transparent;color:var(--muted);opacity:.45;cursor:default}
.cal button.booked{background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 7px);color:var(--muted);text-decoration:line-through}
.cal button.pending{border:1.5px dashed var(--sun);color:var(--muted)}
.cal button.inrange{background:var(--sun-soft);border-radius:4px}
.cal button.sel{background:var(--sun);color:var(--sun-ink);font-weight:700;text-decoration:none}
.cal button.sel small{color:var(--sun-ink)}
.cal button.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cal .bars{position:absolute;left:4px;right:4px;bottom:4px;display:flex;flex-direction:column;gap:2px}
.cal .bars i{height:4px;border-radius:2px;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid var(--line);background:var(--surface)}
.sw.b{background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 7px)}
.sw.p{border:1.5px dashed var(--sun)}
.sw.s{background:var(--sun);border-color:var(--sun)}
.selbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.selbar .grow b{font-variant-numeric:tabular-nums}

/* forms */
label.f{display:flex;flex-direction:column;gap:5px;font-size:.88rem;font-weight:500}
label.f span.opt{color:var(--muted);font-weight:400}
input[type=text],input[type=tel],input[type=email],input[type=password],input[type=number],input[type=url],input[type=date],select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
textarea{min-height:90px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--pine)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
details.privacy{font-size:.84rem;color:var(--muted)}
details.privacy summary{cursor:pointer}
.callout{background:var(--pine-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:.9rem}
.callout.warn{background:var(--sun-soft)}

/* status */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.pending{background:var(--sun-soft);color:var(--ink)}
.pill.confirmed{background:var(--pine-soft);color:var(--pine)}
.pill.declined,.pill.cancelled{background:var(--rose-soft);color:var(--rose)}
.pill.blocked{background:var(--line);color:var(--ink)}
.code-big{font-family:var(--mono);font-size:2rem;letter-spacing:.14em;text-align:center;padding:10px;background:var(--bg);border-radius:12px}
.secret{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--bg);border-radius:12px;padding:12px 14px}
.secret b{font-family:var(--mono);font-size:1.4rem;letter-spacing:.1em;word-break:break-all}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;counter-increment:s}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--sun-soft);display:grid;place-items:center;font-weight:600;font-size:.85rem}

/* checklist */
.checklist{display:flex;flex-direction:column;gap:2px}
.checklist label{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.checklist input{width:22px;height:22px;flex:none;accent-color:var(--pine);margin-top:1px}
.checklist input:checked + span{color:var(--muted);text-decoration:line-through}

/* admin */
.admin-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.admin-tabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500;cursor:pointer;font-size:.9rem}
.admin-tabs button[aria-current="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.stat span{font-size:.78rem;color:var(--muted)}
.bk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.bk.st-pending{border-left:4px solid var(--sun)}
.bk.st-confirmed{border-left:4px solid var(--pine)}
.bk.st-blocked{border-left:4px solid var(--muted)}
.bk .head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.bk .when{font-weight:600;font-variant-numeric:tabular-nums}
.bk .meta{font-size:.86rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.bk .msg{font-size:.9rem;background:var(--bg);border-radius:8px;padding:8px 10px;white-space:pre-wrap}
.ed-sec{display:flex;flex-direction:column;gap:10px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.ed-item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
.ed-item .fields{display:flex;flex-direction:column;gap:6px;min-width:0}
.ed-item .ops{display:flex;flex-direction:column;gap:4px}
.ed-item .ops button{width:36px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer}
.photo-ed{display:grid;grid-template-columns:84px 1fr auto;gap:10px;align-items:center}
.photo-ed img{width:84px;height:64px;object-fit:cover;border-radius:8px;display:block}
.savebar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;z-index:5}
pre.sql{max-height:220px;overflow:auto;background:var(--bg);border-radius:10px;padding:10px;font-size:.72rem;margin:0;white-space:pre}
.demo{background:var(--sun-soft);font-size:.82rem;text-align:center;padding-block:6px}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(10,15,20,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.dialog{background:var(--surface);border-radius:18px;padding:20px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.overlay{align-items:center}}
.lightbox{position:fixed;inset:0;background:rgba(5,8,12,.94);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.lightbox img{max-height:72vh;max-width:100%;border-radius:8px}
.lightbox p{color:#e6e9ec;font-size:.9rem}
.lightbox .row .btn{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;z-index:70;font-size:.9rem;max-width:calc(100% - 32px);text-align:center}

footer{padding-block:24px 36px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted)}
footer .row{justify-content:space-between}
footer button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px 0;font-size:.8rem}
.skeleton{height:200px;border-radius:var(--r);background:var(--surface)}
/* ===== ConvoTrans restyle ===== */
body{font-size:15px;letter-spacing:-.005em}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em}
h1{font-size:1.9rem;font-weight:700}
h2{font-size:1.25rem;font-weight:700}
.eyebrow{font-family:var(--display);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600}
.sec-head{display:flex;flex-direction:column;gap:2px}
body::before{background:var(--hdr)}
.top{background:var(--hdr);border-bottom:0;color:var(--hdr-ink)}
.brand b{font-family:var(--display);font-size:1.12rem;letter-spacing:.01em}
.plaque{border-color:var(--accent);color:var(--accent);font-family:var(--display);font-weight:600}
.tabs button{color:var(--hdr-muted);border-radius:0;font-family:var(--body)}
.tabs button[aria-current="page"]{color:var(--hdr-ink);background:transparent;box-shadow:inset 0 -3px 0 var(--brand-mint)}
.tabs .dot{background:var(--accent)}
.brand .host-chip{color:var(--hdr-muted)}
.me-btn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--hdr-muted);background:transparent;color:var(--hdr-ink);display:grid;place-items:center;cursor:pointer;position:relative;padding:0}
.me-btn .ic{width:19px;height:19px}
.me-btn.ghost-ic{border-color:transparent;color:var(--hdr-muted)}
.me-btn.ghost-ic:active .ic{transform:rotate(180deg);transition:transform .3s}
.me-btn.on{background:var(--brand-mint);border-color:var(--brand-mint);color:var(--forest-900)}
.me-btn.has::after{content:"";position:absolute;top:0;right:0;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--hdr)}
.me-btn:focus-visible{outline:2px solid var(--brand-mint);outline-offset:2px}

const SETUP_SQL = "-- 남위례 햇살집 · 서버 설정 SQL (Supabase → SQL Editor에 통째로 붙여넣고 Run)\n-- 여러 번 실행해도 안전합니다.\n\n-- 1) 관리자\ncreate table if not exists stay_admins (\n  user_id uuid primary key references auth.users on delete cascade,\n  created_at timestamptz default now()\n);\nalter table stay_admins enable row level security;\n\ncreate or replace function stay_is_admin() returns boolean\nlanguage sql stable security definer set search_path = public as $$\n  select exists (select 1 from stay_admins where user_id = auth.uid())\n$$;\n\n-- 처음 로그인한 한 사람만 관리자가 됩니다\ncreate or replace function stay_claim_admin() returns boolean\nlanguage plpgsql security definer set search_path = public as $$\nbegin\n  if auth.uid() is null then return false; end if;\n  if exists (select 1 from stay_admins) then\n    return exists (select 1 from stay_admins where user_id = auth.uid());\n  end if;\n  insert into stay_admins (user_id) values (auth.uid());\n  return true;\nend $$;\n\n-- 2) 공개 내용 (소개, 공지, 사진 등) — 누구나 읽기, 관리자만 수정\ncreate table if not exists stay_content (\n  id int primary key default 1 check (id = 1),\n  data jsonb not null default '{}'::jsonb,\n  updated_at timestamptz default now()\n);\ninsert into stay_content (id) values (1) on conflict do nothing;\nalter table stay_content enable row level security;\ndrop policy if exists \"stay content read\" on stay_content;\ncreate policy \"stay content read\" on stay_content for select using (true);\ndrop policy if exists \"stay content write\" on stay_content;\ncreate policy \"stay content write\" on stay_content for update using (stay_is_admin()) with check (stay_is_admin());\n\n-- 3) 예약 — 개인정보라서 관리자만 볼 수 있음. 날짜 겹침은 서버가 막음\ncreate table if not exists stay_bookings (\n  id uuid primary key default gen_random_uuid(),\n  code text unique not null,\n  name text not null,\n  phone text not null default '',\n  kakao text not null default '',\n  guests int not null default 1,\n  check_in date not null,\n  check_out date not null,\n  message text not null default '',\n  status text not null default 'pending'\n    check (status in ('pending','confirmed','declined','cancelled','blocked')),\n  admin_note text not null default '',\n  created_at timestamptz default now(),\n  updated_at timestamptz default now(),\n  check (check_out > check_in)\n);\n-- 확정·호스트 사용 날짜만 서로 겹칠 수 없음 (신청 중인 날짜는 대기 신청 가능)\nalter table stay_bookings drop constraint if exists stay_no_overlap;\nalter table stay_bookings add constraint stay_no_overlap exclude using gist (daterange(check_in, check_out) with &&)\n  where (status in ('confirmed','blocked'));\nalter table stay_bookings add column if not exists checks jsonb not null default '{}'::jsonb;\nalter table stay_bookings add column if not exists checks_at timestamptz;\nalter table stay_bookings enable row level security;\ndrop policy if exists \"stay bookings admin\" on stay_bookings;\ncreate policy \"stay bookings admin\" on stay_bookings for all using (stay_is_admin()) with check (stay_is_admin());\n\n-- 4) 비밀 정보 (출입 비번, 와이파이, 호수) — 관리자만\ncreate table if not exists stay_secret (\n  id int primary key default 1 check (id = 1),\n  door_code text not null default '',\n  wifi_name text not null default '',\n  wifi_pw text not null default '',\n  private_guide text not null default '',\n  show_in_app boolean not null default false,\n  updated_at timestamptz default now()\n);\ninsert into stay_secret (id) values (1) on conflict do nothing;\nalter table stay_secret enable row level security;\ndrop policy if exists \"stay secret admin\" on stay_secret;\ncreate policy \"stay secret admin\" on stay_secret for all using (stay_is_admin()) with check (stay_is_admin());\n\n-- 5) 손님용 기능 (이름·연락처는 절대 내보내지 않음)\ncreate or replace function stay_busy_dates()\nreturns table (check_in date, check_out date, status text)\nlanguage sql stable security definer set search_path = public as $$\n  select b.check_in, b.check_out,\n         case when b.status = 'pending' then 'pending' else 'booked' end\n  from stay_bookings b\n  where b.status in ('pending','confirmed','blocked')\n    and b.check_out >= (now() at time zone 'Asia/Seoul')::date - 1\n$$;\n\ncreate or replace function stay_request(\n  p_name text, p_phone text, p_kakao text, p_guests int,\n  p_in date, p_out date, p_message text)\nreturns json language plpgsql security definer set search_path = public as $$\ndeclare\n  v_today date := (now() at time zone 'Asia/Seoul')::date;\n  v_max int; v_maxn int; v_minn int; v_digits text; v_code text := '';\n  v_abc text := 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; i int; v_q int;\nbegin\n  select coalesce((data->>'maxGuests')::int, 2), coalesce((data->>'maxNights')::int, 90),\n         coalesce((data->>'minNights')::int, 1)\n    into v_max, v_maxn, v_minn from stay_content where id = 1;\n  v_digits := regexp_replace(coalesce(p_phone, ''), '\\D', '', 'g');\n  if length(trim(coalesce(p_name, ''))) < 1 or length(p_name) > 40 then raise exception 'bad_name'; end if;\n  if length(v_digits) < 9 or length(v_digits) > 13 then raise exception 'bad_phone'; end if;\n  if p_in < v_today or p_out <= p_in or p_in > v_today + 400\n     or (p_out - p_in) > v_maxn or (p_out - p_in) < v_minn then raise exception 'bad_dates'; end if;\n  if p_guests < 1 or p_guests > v_max then raise exception 'bad_guests'; end if;\n  if (select count(*) from stay_bookings where phone = v_digits and status = 'pending') >= 3 then\n    raise exception 'too_many';\n  end if;\n  if exists (select 1 from stay_bookings where status in ('confirmed','blocked')\n             and daterange(check_in, check_out) && daterange(p_in, p_out)) then\n    raise exception 'overlap';\n  end if;\n  select 1 + count(*) into v_q from stay_bookings\n   where status = 'pending' and daterange(check_in, check_out) && daterange(p_in, p_out);\n  for i in 1..8 loop\n    v_code := v_code || substr(v_abc, 1 + floor(random() * length(v_abc))::int, 1);\n  end loop;\n  begin\n    insert into stay_bookings (code, name, phone, kakao, guests, check_in, check_out, message)\n    values (v_code, trim(p_name), v_digits, left(coalesce(p_kakao, ''), 40), p_guests,\n            p_in, p_out, left(coalesce(p_message, ''), 500));\n  exception when exclusion_violation then\n    raise exception 'overlap';\n  end;\n  return json_build_object('code', v_code, 'check_in', p_in, 'check_out', p_out, 'status', 'pending', 'queue', v_q);\nend $$;\n\n-- 예약코드 + 휴대폰 뒤 4자리로 조회. '앱에서 보여주기'가 켜져 있으면 확정 + 입실 전날~퇴실 날에만 비번 공개\ncreate or replace function stay_lookup(p_code text, p_last4 text)\nreturns json language plpgsql security definer set search_path = public as $$\ndeclare\n  v_today date := (now() at time zone 'Asia/Seoul')::date;\n  b stay_bookings%rowtype; s stay_secret%rowtype; r jsonb;\nbegin\n  select * into b from stay_bookings\n   where code = upper(trim(p_code)) and right(phone, 4) = trim(p_last4) and status <> 'blocked';\n  if not found then return null; end if;\n  r := jsonb_build_object('code', b.code, 'name', b.name, 'guests', b.guests,\n        'check_in', b.check_in, 'check_out', b.check_out, 'status', b.status, 'checks', b.checks);\n  if b.status = 'pending' then\n    r := r || jsonb_build_object('queue', 1 + (select count(*) from stay_bookings x\n      where x.status = 'pending' and x.id <> b.id and x.created_at < b.created_at\n        and daterange(x.check_in, x.check_out) && daterange(b.check_in, b.check_out)));\n  end if;\n  if b.status = 'confirmed' then\n    select * into s from stay_secret where id = 1;\n    if not coalesce(s.show_in_app, false) then\n      r := r || jsonb_build_object('reveal_by_host', true);\n    elsif v_today between b.check_in - 1 and b.check_out then\n      r := r || jsonb_build_object('door_code', s.door_code, 'wifi_name', s.wifi_name,\n             'wifi_pw', s.wifi_pw, 'private_guide', s.private_guide);\n    end if;\n  end if;\n  return r::json;\nend $$;\n\ncreate or replace function stay_cancel(p_code text, p_last4 text)\nreturns boolean language plpgsql security definer set search_path = public as $$\ndeclare v_today date := (now() at time zone 'Asia/Seoul')::date; n int;\nbegin\n  update stay_bookings set status = 'cancelled', updated_at = now()\n   where code = upper(trim(p_code)) and right(phone, 4) = trim(p_last4)\n     and status in ('pending','confirmed') and check_in > v_today;\n  get diagnostics n = row_count;\n  return n > 0;\nend $$;\n\n-- 퇴실 체크리스트 저장 (확정된 본인 예약만)\ncreate or replace function stay_save_checks(p_code text, p_last4 text, p_checks jsonb)\nreturns boolean language plpgsql security definer set search_path = public as $$\ndeclare n int;\nbegin\n  if pg_column_size(p_checks) > 2000 then return false; end if;\n  update stay_bookings set checks = coalesce(p_checks, '{}'::jsonb), checks_at = now()\n   where code = upper(trim(p_code)) and right(phone, 4) = trim(p_last4) and status = 'confirmed';\n  get diagnostics n = row_count;\n  return n > 0;\nend $$;\n\ngrant execute on function stay_save_checks(text,text,jsonb) to anon, authenticated;\ngrant execute on function stay_busy_dates() to anon, authenticated;\ngrant execute on function stay_request(text,text,text,int,date,date,text) to anon, authenticated;\ngrant execute on function stay_lookup(text,text) to anon, authenticated;\ngrant execute on function stay_cancel(text,text) to anon, authenticated;\ngrant execute on function stay_claim_admin() to authenticated;\ngrant execute on function stay_is_admin() to anon, authenticated;\n\n-- 6) 사진 저장소 (누구나 보기, 관리자만 올리기/지우기)\ninsert into storage.buckets (id, name, public) values ('stay-photos', 'stay-photos', true)\non conflict (id) do nothing;\ndrop policy if exists \"stay photos insert\" on storage.objects;\ncreate policy \"stay photos insert\" on storage.objects for insert to authenticated\n  with check (bucket_id = 'stay-photos' and public.stay_is_admin());\ndrop policy if exists \"stay photos update\" on storage.objects;\ncreate policy \"stay photos update\" on storage.objects for update to authenticated\n  using (bucket_id = 'stay-photos' and public.stay_is_admin());\ndrop policy if exists \"stay photos delete\" on storage.objects;\ncreate policy \"stay photos delete\" on storage.objects for delete to authenticated\n  using (bucket_id = 'stay-photos' and public.stay_is_admin());\n\n-- 7) 자동 백업 — 매일 새벽 3시(한국 시간)에 내용과 예약을 복사해 30일 보관 (비밀번호 정보는 제외)\ncreate table if not exists stay_backups (\n  id bigint generated always as identity primary key,\n  created_at timestamptz default now(),\n  data jsonb not null\n);\nalter table stay_backups enable row level security;\ndrop policy if exists \"stay backups admin\" on stay_backups;\ncreate policy \"stay backups admin\" on stay_backups for select using (stay_is_admin());\n\ncreate or replace function stay_backup_now() returns bigint\nlanguage plpgsql security definer set search_path = public as $$\ndeclare v_id bigint;\nbegin\n  if auth.uid() is not null and not stay_is_admin() then raise exception 'not_admin'; end if;\n  insert into stay_backups (data)\n  select jsonb_build_object(\n    'content', (select data from stay_content where id = 1),\n    'bookings', coalesce((select jsonb_agg(to_jsonb(b) order by b.check_in) from stay_bookings b), '[]'::jsonb))\n  returning id into v_id;\n  delete from stay_backups where created_at < now() - interval '30 days';\n  return v_id;\nend $$;\nrevoke execute on function stay_backup_now() from public, anon;\ngrant execute on function stay_backup_now() to authenticated;\n\ndo $$\nbegin\n  create extension if not exists pg_cron;\n  perform cron.unschedule('stay-daily-backup') where exists (select 1 from cron.job where jobname = 'stay-daily-backup');\n  perform cron.schedule('stay-daily-backup', '0 18 * * *', 'select public.stay_backup_now()');\nexception when others then\n  raise notice '자동 백업 예약을 건너뜀 (pg_cron 사용 불가). 앱의 \"지금 백업\" 버튼은 그대로 쓸 수 있어요.';\nend $$;\n\n-- 8) 호스트 여러 명 — 호스트가 다른 사람의 이메일을 호스트로 추가/삭제\ncreate or replace function stay_add_admin(p_email text) returns boolean\nlanguage plpgsql security definer set search_path = public, auth as $$\ndeclare v uuid;\nbegin\n  if not stay_is_admin() then raise exception 'not_admin'; end if;\n  select id into v from auth.users where lower(email) = lower(trim(p_email));\n  if v is null then raise exception 'no_user'; end if;\n  insert into stay_admins (user_id) values (v) on conflict do nothing;\n  return true;\nend $$;\n\ncreate or replace function stay_list_admins() returns table (email text, me boolean)\nlanguage sql stable security definer set search_path = public, auth as $$\n  select u.email::text, u.id = auth.uid()\n  from stay_admins a join auth.users u on u.id = a.user_id\n  where stay_is_admin()\n  order by a.created_at\n$$;\n\ncreate or replace function stay_remove_admin(p_email text) returns boolean\nlanguage plpgsql security definer set search_path = public, auth as $$\ndeclare v uuid;\nbegin\n  if not stay_is_admin() then raise exception 'not_admin'; end if;\n  select id into v from auth.users where lower(email) = lower(trim(p_email));\n  if v is null or v = auth.uid() then raise exception 'cannot_remove'; end if;\n  delete from stay_admins where user_id = v;\n  return true;\nend $$;\n\nrevoke execute on function stay_add_admin(text) from public, anon;\nrevoke execute on function stay_list_admins() from public, anon;\nrevoke execute on function stay_remove_admin(text) from public, anon;\ngrant execute on function stay_add_admin(text) to authenticated;\ngrant execute on function stay_list_admins() to authenticated;\ngrant execute on function stay_remove_admin(text) to authenticated;\n";

/* ---------- utils ---------- */
const LS = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nl = s => esc(s).replace(/\n/g,"<br>");
const clone = o => JSON.parse(JSON.stringify(o));
function todayStr(){ return new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date()); }
function addDays(s,n){ const d = new Date(s+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function diffDays(a,b){ return Math.round((Date.parse(b+"T00:00:00Z") - Date.parse(a+"T00:00:00Z"))/864e5); }
const WD = "일월화수목금토";
function fmtD(s){ if(!s) return ""; const d = new Date(s+"T00:00:00Z"); return `${d.getUTCMonth()+1}.${d.getUTCDate()}(${WD[d.getUTCDay()]})`; }
function fmtDY(s){ const d = new Date(s+"T00:00:00Z"); return `${d.getUTCFullYear()}.${d.getUTCMonth()+1}.${d.getUTCDate()}(${WD[d.getUTCDay()]})`; }
function fmtPhone(p){ const d = String(p||"").replace(/\D/g,""); if(d.length===11) return d.replace(/(\d{3})(\d{4})(\d{4})/,"$1-$2-$3"); if(d.length===10) return d.replace(/(\d{3})(\d{3})(\d{4})/,"$1-$2-$3"); return d; }
function shiftMonth(ym,n){ const [y,m] = ym.split("-").map(Number); return new Date(Date.UTC(y,m-1+n,1)).toISOString().slice(0,7); }
function monthCells(ym){
  const [y,m] = ym.split("-").map(Number);
  const start = new Date(Date.UTC(y,m-1,1)).getUTCDay();
  const days = new Date(Date.UTC(y,m,0)).getUTCDate();
  const cells = [];
  for(let i=0;i<start;i++) cells.push(null);
  for(let d=1; d<=days; d++) cells.push(`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`);
  while(cells.length % 7) cells.push(null);
  return cells;
}
function getPath(o,p){ return p.split(".").reduce((a,k)=> a==null ? a : a[k], o); }
function setPath(o,p,v){ const ks = p.split("."); const last = ks.pop(); const t = ks.reduce((a,k)=> a[k], o); t[last] = v; }
function uid(){ return Math.random().toString(36).slice(2,9); }
function appUrl(){ try{ return location.href.split("#")[0].split("?")[0]; }catch(e){ return ""; } }

let toastTimer;
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(()=> t.hidden = true, 2600); }
async function copy(text, done="복사했어요"){
  try{ await navigator.clipboard.writeText(text); toast(done); }
  catch(e){ S.dialog = { title:"아래 내용을 길게 눌러 복사하세요", copyText:text, okLabel:"닫기", noCancel:true }; render(); }
}

const ERR = {
  overlap:"방금 다른 신청과 날짜가 겹쳤어요. 달력을 새로 불러왔으니 다시 골라 주세요.",
  bad_dates:"날짜를 다시 확인해 주세요. 최소·최대 숙박 일수를 벗어났을 수 있어요.",
  bad_phone:"휴대폰 번호를 숫자로 정확히 입력해 주세요.",
  bad_name:"이름을 입력해 주세요.",
  bad_guests:"인원을 확인해 주세요.",
  too_many:"확인 대기 중인 신청이 이미 여러 건 있어요. 호스트에게 직접 연락해 주세요."
};
function errMsg(e){
  const m = String((e && e.message) || e);
  for(const k in ERR) if(m.includes(k)) return ERR[k];
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return "인터넷 연결을 확인해 주세요.";
  if(/no_user/.test(m)) return "그 이메일로 만든 계정이 없어요. 먼저 앱에서 '계정 만들기'를 해 달라고 하세요.";
  if(/cannot_remove/.test(m)) return "본인은 호스트에서 뺄 수 없어요.";
  if(/stay_no_overlap|exclusion/i.test(m)) return "이미 확정된 예약과 날짜가 겹쳐요.";
  if(/rate limit/i.test(m)) return "짧은 시간에 메일을 너무 많이 보냈어요. 한 시간쯤 뒤에 다시 해 주세요.";
  if(/Email not confirmed/i.test(m)) return "이메일 인증이 아직 안 됐어요. Gmail에서 Supabase 인증 메일의 링크를 누른 뒤 다시 로그인하세요.";
  if(/Invalid login/i.test(m)) return "이메일 또는 비밀번호가 맞지 않아요.";
  if(/already registered/i.test(m)) return "이미 있는 계정이에요. 로그인해 주세요.";
  if(/Password should be/i.test(m)) return "비밀번호는 6자 이상으로 해 주세요.";
  return m;
}

function mergeContent(saved){
  const d = defaultContent();
  if(!saved || typeof saved !== "object") return d;
  const out = Object.assign(d, saved);
  out.contact = Object.assign(defaultContent().contact, saved.contact || {});
  if(saved.pricingV !== 7){
    // v1.9 이전에 저장된 내용 → 4주 단위 요금/조건으로 갱신
    const def = defaultContent();
    ["minNights","maxNights","unitNights","stepNights","firstPrice","weekPrice","nextPrice","pricingV"].forEach(k => out[k] = def[k]);
    out.conditions = (out.conditions || []).filter(x => x.label !== "연장").map(x => { const m = def.conditions.find(y => y.label === x.label); return (x.label === "숙박" || x.label === "요금" || x.label === "이용료") && m ? m : (x.label === "요금" ? def.conditions.find(y=>y.label==="이용료") : x); });
    const fi = out.conditions.findIndex(x => x.label === "이용료");
    out.conditions.splice(fi >= 0 ? fi + 1 : out.conditions.length, 0, def.conditions.find(y => y.label === "연장"));
  }
  if(!saved.amenV){
    const k = defaultContent().amenities.find(a => a.icon === "kettle");
    const list = (out.amenities || []).filter(a => a.label !== "전기주전자");
    const i = list.findIndex(a => a.label === "에어프라이어");
    if(i >= 0) list.splice(i, 1, k); else list.push(k);
    out.amenities = list; out.amenV = 1;
  }
  if((out.amenV||0) < 2){
    const d = defaultContent().amenities, bed = d.find(a => a.label === "2인용 침대"), extra = d.find(a => a.label === "여분 침구");
    const list = (out.amenities || []).filter(a => a.label !== "여분 침구");
    const i = list.findIndex(a => a.label === "2인용 침대");
    if(i >= 0) list.splice(i, 1, bed, extra); else list.push(bed, extra);
    out.amenities = list; out.amenV = 2;
  }
  if(!saved.sizeV){
    ["facts","amenities","info","location","building"].forEach(k => { if(out[k]) out[k] = JSON.parse(JSON.stringify(out[k]).replace(/17평/g,"15평")); });
    out.sizeV = 1;
  }
  const GUIDE_ADDS = [[1,"탄천 산책길"],[2,"장보기"],[4,"도자기 공방"]];
  const gv = saved.guideV || 0;
  if(gv < 4){
    out.guideItems = (out.guideItems || []).filter(g => g.title !== "취미생활");
    const defs = defaultContent().guideItems;
    GUIDE_ADDS.filter(([v]) => v > gv).forEach(([,title]) => {
      out.guideItems = (out.guideItems || []).filter(g => g.title !== title).concat([defs.find(g => g.title === title)]);
    });
    out.guideV = 4;
  }
  return out;
}

const LIVE = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY);

function liveApi(){
  const U = CONFIG.SUPABASE_URL.trim().replace(/\/$/,""), K = CONFIG.SUPABASE_KEY.trim();
  let sess = LS.get("stay_session", null);
  function setSess(j){
    sess = (j && j.access_token) ? {
      access_token:j.access_token, refresh_token:j.refresh_token,
      expires_at: j.expires_at || Math.floor(Date.now()/1000) + (j.expires_in || 3600),
      email: (j.user && j.user.email) || (sess && sess.email) || ""
    } : null;
    sess ? LS.set("stay_session", sess) : LS.del("stay_session");
  }
  async function refresh(){
    try{
      const r = await fetch(U+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:sess.refresh_token})});
      if(!r.ok) throw new Error("refresh");
      setSess(await r.json());
    }catch(e){ setSess(null); }
  }
  async function token(){
    if(!sess) return K;
    if(Date.now()/1000 > sess.expires_at - 60) await refresh();
    return sess ? sess.access_token : K;
  }
  async function req(path, {method="GET", body, headers={}} = {}){
    const t = await token();
    const isRaw = body instanceof Blob || typeof body === "string";
    const auth = /^eyJ/.test(t) ? {Authorization:"Bearer "+t} : {};
    const r = await fetch(U+path, {method, headers:{apikey:K, ...auth, "Content-Type":"application/json", ...headers},
      body: body === undefined ? undefined : (isRaw ? body : JSON.stringify(body))});
    const txt = await r.text(); let j = null;
    try{ j = txt ? JSON.parse(txt) : null; }catch(e){ j = txt; }
    if(!r.ok){ const m = (j && (j.message || j.msg || j.error_description || j.error)) || ("HTTP "+r.status); const err = new Error(m); err.status = r.status; throw err; }
    return j;
  }
  const rpc = (fn, args) => req("/rest/v1/rpc/"+fn, {method:"POST", body:args || {}});
  return {
    live:true,
    async getContent(){ const r = await req("/rest/v1/stay_content?id=eq.1&select=data"); return mergeContent(r && r[0] && r[0].data); },
    async saveContent(data){ await req("/rest/v1/stay_content?id=eq.1",{method:"PATCH",body:{data, updated_at:new Date().toISOString()},headers:{Prefer:"return=minimal"}}); },
    async busy(){ return await rpc("stay_busy_dates") || []; },
    async request(f){ return await rpc("stay_request",{p_name:f.name,p_phone:f.phone,p_kakao:f.kakao,p_guests:f.guests,p_in:f.check_in,p_out:f.check_out,p_message:f.message}); },
    async lookup(code,last4){ return await rpc("stay_lookup",{p_code:code,p_last4:last4}); },
    async cancel(code,last4){ return await rpc("stay_cancel",{p_code:code,p_last4:last4}); },
    async saveChecks(code,last4,checks){ return await rpc("stay_save_checks",{p_code:code,p_last4:last4,p_checks:checks}); },
    session(){ return sess; },
    async login(email,pw){
      const r = await fetch(U+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify({email,password:pw})});
      const j = await r.json(); if(!r.ok) throw new Error(j.error_description || j.msg || j.message || "로그인 실패");
      setSess(j); return await rpc("stay_claim_admin");
    },
    async signup(email,pw){
      const r = await fetch(U+"/auth/v1/signup",{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify({email,password:pw})});
      const j = await r.json(); if(!r.ok) throw new Error(j.msg || j.message || j.error_description || "가입 실패");
      if(!j.access_token) throw new Error("계정은 만들어졌어요. 이 서버는 이메일 인증을 먼저 해야 해요. Gmail에서 Supabase가 보낸 인증 메일의 링크를 누른 뒤, 이 화면에서 '이미 계정이 있어요'를 눌러 같은 이메일과 비밀번호로 로그인하세요.");
      setSess(j); return await rpc("stay_claim_admin");
    },
    async checkAdmin(){ if(!sess) return false; try{ return await rpc("stay_claim_admin"); }catch(e){ return false; } },
    logout(){ setSess(null); },

  const queueOf = (bk) => 1 + db.bookings.filter(x => x.id !== bk.id && x.status === "pending" && (x.created_at||"") < (bk.created_at||"~") && bk.check_in < x.check_out && x.check_in < bk.check_out).length;
  let authed = !!LS.get("stay_demo_auth", false);

    async busy(){ const y = addDays(todayStr(),-1); return wait(db.bookings.filter(b => active(b) && b.check_out >= y).map(b => ({check_in:b.check_in,check_out:b.check_out,status:b.status==="pending"?"pending":"booked"}))); },
    async request(f){
      const c = mergeContent(db.content), t = todayStr(), n = diffDays(f.check_in,f.check_out), digits = String(f.phone).replace(/\D/g,"");
      if(!f.name.trim()) throw new Error("bad_name");
      if(digits.length < 9) throw new Error("bad_phone");

      const abc = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let code = ""; for(let i=0;i<8;i++) code += abc[Math.floor(Math.random()*abc.length)];

      const queue = queueOf(nb); db.bookings.push(nb);

      }
      return wait(r);
    },
    async cancel(code,last4){
      const b = db.bookings.find(x => x.code === code.trim().toUpperCase() && x.phone.slice(-4) === last4.trim());
      if(!b || !["pending","confirmed"].includes(b.status) || b.check_in <= todayStr()) return wait(false);
      b.status = "cancelled"; save(); return wait(true);
    },
    async saveChecks(code,last4,checks){
      const b = db.bookings.find(x => x.code === code.trim().toUpperCase() && x.phone.slice(-4) === last4.trim() && x.status === "confirmed");
      if(!b) return wait(false);

    async updateBooking(id,patch){
      const b = db.bookings.find(x => x.id === id); if(!b) throw new Error("없는 예약이에요");
      if(patch.status && ["confirmed","blocked"].includes(patch.status) && !hard(b) && overlaps(b.check_in,b.check_out,id)) throw new Error("overlap");
      Object.assign(b, patch); save(); return wait(true);
    },
    async block(ci,co,note){ if(overlaps(ci,co)) throw new Error("overlap"); db.bookings.push({id:uid(),code:"BLK"+uid(),name:"호스트 사용",phone:"",kakao:"",guests:1,check_in:ci,check_out:co,message:"",status:"blocked",admin_note:note||"",created_at:new Date().toISOString()}); save(); return wait(true); },
    async deleteBooking(id){ db.bookings = db.bookings.filter(x => x.id !== id); save(); return wait(true); },
    async getSecret(){ return wait(db.secret); },
    async saveSecret(s){ db.secret = clone(s); save(); return wait(true); },
    async uploadPhoto(blob){ return new Promise((res,rej)=>{ const fr = new FileReader(); fr.onload = ()=> res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); }); },
    async listAdmins(){ return wait((db.admins||["demo@host"]).map((e,i)=>({email:e, me:i===0}))); },
    async addAdmin(email){ db.admins = db.admins || ["demo@host"]; if(!db.admins.includes(email)) db.admins.push(email); save(); return wait(true); },
    async removeAdmin(email){ db.admins = (db.admins||["demo@host"]).filter(e => e !== email || e === "demo@host"); save(); return wait(true); },
    async listBackups(){ return wait((db.backups||[]).map(b=>({id:b.id,created_at:b.created_at})).reverse()); },
    async getBackup(id){ const b = (db.backups||[]).find(x=>x.id===id); return wait(b && b.data); },
    async backupNow(){ db.backups = db.backups || []; const id = Date.now(); db.backups.push({id, created_at:new Date().toISOString(), data:{content:db.content, bookings:db.bookings}}); db.backups = db.backups.slice(-30); save(); return wait(id); },
    reset(){ db = seed(); save(); }
  };
}

function setBusy(list){
  S.busy = list || [];
  const m = {}, q = {};
  for(const r of S.busy){ for(let d = r.check_in; d < r.check_out; d = addDays(d,1)){ if(r.status === "pending") q[d] = (q[d]||0) + 1; else m[d] = "booked"; } }
  S.busyMap = m; S.pendMap = q;
}
function lastDay(out){ return addDays(out,-1); }   // 저장은 '나간 다음 날'(배타적), 화면은 '마지막 날'
function unitOf(){ return Math.max(1, Number(S.content.unitNights)||28); }
function stepOf(){ return Math.max(1, Number(S.content.stepNights)||7); }
function weeksLabel(n){ return n % 7 === 0 ? `${n/7}주` : `${n}일`; }
function okLength(n){ const c = S.content, u = unitOf(); return n >= Math.max(u, c.minNights) && n <= c.maxNights && (n - u) % stepOf() === 0; }
function feeParts(n){
  const c = S.content, u = unitOf(), st = stepOf();
  if(n < u || (n - u) % st) return null;
  const extra = n - u, sets = Math.floor(extra / u), steps = (extra - sets*u) / st;
  return {fee:(Number(c.firstPrice)||0) + sets*(Number(c.nextPrice)||0) + steps*(Number(c.weekPrice)||0), sets};
}
function feeFor(n){ const f = feeParts(n); return f ? f.fee : null; }
function validCheckout(ci,d){ return okLength(diffDays(ci,d)) && rangeFree(ci,d,S.busyMap); }
function pendingIn(a,b){ let n = 0; for(let d=a; d<b; d=addDays(d,1)) n = Math.max(n, (S.pendMap||{})[d] || 0); return n; }
function rangeFree(a,b,map){ for(let d=a; d<b; d=addDays(d,1)) if(map[d]) return false; return true; }

  const uw = weeksLabel(u), sw = weeksLabel(st);

      <div class="pt main"><span>첫 ${uw}</span><b>${F}<small>만 원</small></b><em>최소 기간</em></div>

  if(!full) return `<div class="price-mini">${tiles}<button class="linkish" data-a="go" data-v="guide">예약하기 전에 이용 안내 확인하기 ›</button></div>`;

  return `<section class="card price-card">${sh("Rates","숙박 요금")}

      ${ex.map(n => { const f = feeParts(n); return f ? `<tr${f.sets?' class="deal"':""}><td>${weeksLabel(n)} <span class="muted small">(${n}일)</span></td><td><b>${f.fee}만 원</b>${f.sets?` <span class="tag">할인</span>`:""}</td></tr>` : ""; }).join("")}
    </tbody></table>
    <p class="small muted">머무는 중에도 ${sw} 단위로 연장할 수 있고, ${uw}를 한 번에 연장하면 똑같이 할인돼요. (뒤에 다음 예약이 없을 때)</p>
  </section>`;
}

function calendar(ym, opts){
  const t = todayStr(), cells = monthCells(ym), [y,m] = ym.split("-").map(Number);
  const canPrev = opts.allowPast || ym > t.slice(0,7);
  return `<div class="stack">
    <div class="cal-head">
      <button class="btn sm" data-a="${opts.navAction}" data-n="-1" ${canPrev?"":"disabled"} aria-label="이전 달">‹</button>
      <b>${y}년 ${m}월</b>
      <button class="btn sm" data-a="${opts.navAction}" data-n="1" aria-label="다음 달">›</button>
    </div>
    <div class="cal" role="grid">
      ${[...WD].map(w => `<div class="wd">${w}</div>`).join("")}
      ${cells.map(d => d ? opts.cell(d,t) : `<span class="empty"></span>`).join("")}
    </div>
  </div>`;
}
function guestCell(d,t){
  const {in:ci, out:co} = S.sel, st = S.busyMap[d], pq = (S.pendMap||{})[d] || 0;
  const cls = [];
  let sub = "";
  if(d < t) cls.push("past");
  else if(st) cls.push("booked");
  else if(pq) cls.push("pending");
  if(d === t) cls.push("today");
  if(ci && d === ci){ cls.push("sel"); sub = "체크인"; }
  else if(co && d === lastDay(co)){ cls.push("sel"); sub = "체크아웃"; }
  else if(ci && co && d > ci && d < lastDay(co)) cls.push("inrange");
  else if(ci && d > ci && validCheckout(ci,addDays(d,1))){ cls.push("goal"); sub = weeksLabel(diffDays(ci,d)+1); }
  if(!sub && st && d >= t) sub = "확정";
  else if(!sub && pq && d >= t) sub = `대기 ${pq}`;
  const dd = Number(d.slice(8));
  return `<button class="${cls.join(" ")}" data-a="pick" data-d="${d}" aria-label="${fmtD(d)}${st?" 예약 확정":pq?` 신청 ${pq}건`:""}">${dd}${sub?`<small>${sub}</small>`:""}</button>`;
}

function guestRegion(){
  try{ const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; if(tz === "Asia/Seoul") return "KR"; if(/^(America|US|Pacific\/Honolulu)/.test(tz)) return "US"; }catch(e){}
  return "";
}
function smsButtons(b){
  const ct = S.content.contact, opts = [];
  if(ct.phone) opts.push({cc:"KR", label:"🇰🇷 한국 번호로 문자 알리기", ph:ct.phone});
  if(ct.phoneUs) opts.push({cc:"US", label:"🇺🇸 미국 번호로 문자 알리기", ph:ct.phoneUs});
  if(!opts.length) return "";
  const r = guestRegion();
  let main = opts.find(o => o.cc === r) || (opts.length === 1 ? opts[0] : null);
  if(!main) main = opts.find(o => o.cc === "US") || opts[0];   // 지역을 모르면 미국 번호(연락이 더 많은 쪽)
  const other = opts.find(o => o !== main);
  const text = notifyText(b);
  return `<a class="btn ${ct.kakaoUrl?"":"primary "}block" data-a="markNotified" data-code="${esc(b.code)}" href="${smsHref(intlPhone(main.ph,main.cc), text)}">문자로 보내기</a>
    ${other ? `<p class="small muted">${main.cc==="KR"?"한국":"미국"}에 계신 것 같아 ${main.cc==="KR"?"한국":"미국"} 번호로 연결해요. <a data-a="markNotified" data-code="${esc(b.code)}" href="${smsHref(intlPhone(other.ph,other.cc), text)}">${other.cc==="KR"?"한국":"미국"} 번호로 보내기</a></p>` : ""}`;
}
function intlPhone(ph, cc){
  let d = String(ph||"").replace(/[^0-9+]/g,"");
  if(d.startsWith("+")) return d;
  if(cc === "KR") return d.startsWith("82") ? "+"+d : "+82" + d.replace(/^0/,"");
  return d.length === 11 && d.startsWith("1") ? "+"+d : "+1" + d;
}
function smsHref(ph, body){ const n = String(ph).replace(/[^0-9+]/g,""); const sep = /iPhone|iPad|iPod/.test(navigator.userAgent) ? "&" : "?"; return `sms:${n}${sep}body=${encodeURIComponent(body)}`; }
function hostContactBlock(){
  const ct = S.content.contact;
  if(!ct.kakaoUrl && !ct.kakaoId && !ct.email) return "";
  return `<div class="stack small">
    ${ct.kakaoUrl ? `<a class="btn block" href="${esc(ct.kakaoUrl)}" target="_blank" rel="noopener">카카오톡으로 호스트에게 연락</a>` : ""}
    ${ct.kakaoId ? `<div class="row"><span class="muted">카카오톡 ID</span><b class="grow">${esc(ct.kakaoId)}</b><button class="btn sm" data-a="copy" data-t="${esc(ct.kakaoId)}">복사</button></div>` : ""}
    ${ct.email ? `<div class="row"><span class="muted">이메일</span><b class="grow" style="word-break:break-all">${esc(ct.email)}</b><button class="btn sm" data-a="copy" data-t="${esc(ct.email)}">복사</button></div>` : ""}
  </div>`;
}
function gcalUrl(b){
  const c = S.content;
  const p = new URLSearchParams({action:"TEMPLATE", text:`${c.name} 숙박`, dates:`${b.check_in.replace(/-/g,"")}/${b.check_out.replace(/-/g,"")}`,
    details:`예약코드 ${b.code}\n${appUrl()}`, location:"남위례역"});
  return "https://calendar.google.com/calendar/render?"+p.toString();
}

function bigDate(s){ const d = new Date(s+"T00:00:00Z"); return `<b>${d.getUTCMonth()+1}.${d.getUTCDate()}</b><span class="lbl">${WD[d.getUTCDay()]}요일 · ${d.getUTCFullYear()}</span>`; }
function myResult(r){
  const n = diffDays(r.check_in,r.check_out), t = todayStr(), reveal = addDays(r.check_in,-1);
  const canCancel = ["pending","confirmed"].includes(r.status) && r.check_in > t;
  const active = ["pending","confirmed"].includes(r.status);
  // progress: 0 신청, 1 확정, 2 출입 정보, 3 체크아웃
  let done = -1, now = -1;
  if(r.status === "pending"){ done = 0; now = 1; }
  else if(r.status === "confirmed"){
    if(t < reveal){ done = 1; now = 2; }
    else if(t <= lastDay(r.check_out)){ done = 2; now = 3; }
    else done = 3;
  }
  const steps = ["신청","확정","입실","퇴실"];
  const progress = active ? `<ol class="progress">${steps.map((x,i)=> `<li class="${i<=done?"done":i===now?"now":""}">${x}</li>`).join("")}</ol>` : "";
  let dday = "";
  if(active && t < r.check_in) dday = `체크인까지 D-${diffDays(t,r.check_in)}`;
  else if(r.status === "confirmed" && t <= lastDay(r.check_out)) dday = t === lastDay(r.check_out) ? "오늘 체크아웃이에요" : `머무는 중 · 체크아웃까지 D-${diffDays(t,lastDay(r.check_out))}`;
  let next = "", extra = "";
  if(r.status === "pending") next = (r.queue||1) > 1
    ? `<b>대기 ${r.queue}순위</b>예요. 먼저 신청하신 분이 ${r.queue-1}명 있어요. 앞 분의 예약이 취소되면 다음 순서로 이용하실 수 있어요.`
    : "<b>1순위</b>예요. 호스트가 카톡으로 금액과 입금 계좌를 안내드려요. 입금이 확인되면 예약이 확정돼요.";
  if(r.status === "pending" && !isNotified(r.code)) extra = `<div class="notify-step"><b>호스트에게 카톡 보내셨나요?</b><p class="small">카톡(또는 문자)을 보내야 접수가 완료돼요. 이미 보내셨다면 무시하셔도 돼요.</p>${notifyButtons(r)}</div>`;
  else if(r.status === "confirmed"){
    if(r.door_code !== undefined && !r.reveal_by_host){
      next = "출입 정보가 열렸어요. 편한 시간에 입실하세요.";
      extra = `<div class="stack">
        <div class="secret"><div><span class="small muted">출입 비밀번호</span><br><b>${esc(r.door_code||"호스트에게 문의")}</b></div>${r.door_code?`<button class="btn sm" data-a="copy" data-t="${esc(r.door_code)}">복사</button>`:""}</div>
        <div class="secret"><div><span class="small muted">와이파이 · ${esc(r.wifi_name||"-")}</span><br><b>${esc(r.wifi_pw||"-")}</b></div>${r.wifi_pw?`<button class="btn sm" data-a="copy" data-t="${esc(r.wifi_pw)}">복사</button>`:""}</div>
        ${r.private_guide ? `<div class="callout">${nl(r.private_guide)}</div>` : ""}
      </div>`;
    }
    else if(r.reveal_by_host){
      if(t < reveal) next = `확정됐어요. 입실 전날(<b>${fmtD(reveal)}</b>) 카톡으로 출입문 비밀번호를 보내드려요.`;
      else if(t <= lastDay(r.check_out)) next = "출입문 비밀번호는 카톡으로 보내드렸어요. 들어오신 뒤 안내문에 따라 바꿔 주시고, 퇴실하실 때는 비밀번호를 꼭 알려 주시거나, 처음 비밀번호로 다시 설정해 두고 나가 주세요.";
      else next = "이용이 끝난 예약이에요. 머물러 주셔서 고마워요.";
    }
    else if(t < reveal) next = `확정됐어요. 출입 비밀번호와 와이파이는 <b>${fmtD(reveal)}</b>부터 여기서 열려요.`;
    else next = "이용이 끝난 예약이에요. 머물러 주셔서 고마워요.";
  }
  else if(r.status === "declined") next = "이번 날짜는 마감됐어요. 먼저 신청하신 분으로 확정됐을 수 있어요. 다른 날짜로 다시 신청해 주세요.";
  else if(r.status === "cancelled") next = "취소된 예약이에요.";
  return `<article class="ticket">
    <div class="ticket-top">
      <div class="row"><span>${esc(r.name)}님 · ${r.guests}명</span><span class="pill ${r.status}">${r.status==="pending"&&(r.queue||1)>1?`대기 ${r.queue}순위`:ST_LABEL[r.status]}</span></div>
      <div class="ticket-dates">
        <div><span class="lbl">체크인</span>${bigDate(r.check_in)}</div>
        <div class="nights">${n}일 →</div>
        <div class="out"><span class="lbl">체크아웃</span>${bigDate(lastDay(r.check_out))}</div>

    else if(kind === "proc") f = `<div class="row"><select id="${id}-s" data-bind="${p}.step" style="width:auto">${["apply","confirm","checkin","checkout","change","dot"].map(k=>`<option value="${k}" ${x.step===k?"selected":""}>${{apply:"신청",confirm:"확정",checkin:"입실",checkout:"퇴실",change:"변경",dot:"기타"}[k]} 아이콘</option>`).join("")}</select></div><input type="text" id="${id}-t" data-bind="${p}.title" value="${esc(x.title)}" placeholder="단계 이름"><textarea id="${id}-b" data-bind="${p}.body" placeholder="설명">${esc(x.body)}</textarea>`;

    return `<div class="ed-item"><div class="fields">${f}</div>${ops(path,i,arr.length)}</div>`;
  };
  return `${arr.map(item).join("")}<button class="btn sm" data-a="ladd" data-p="${path}" data-k="${kind}">+ ${addLabel}</button>`;
}

function makeIcs(code,ci,co){
  const c = S.content, f = s => s.replace(/-/g,"");
  const stamp = new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//JennyRyu//Stay//KO","BEGIN:VEVENT",`UID:${code}@stay`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${f(ci)}`,`DTEND;VALUE=DATE:${f(co)}`,
    `SUMMARY:${c.name} 숙박`,`DESCRIPTION:예약코드 ${code}`,`LOCATION:남위례역`,
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:내일 체크인이에요","TRIGGER:-PT9H","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
}
function download(name,text,type){
  try{ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text],{type})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }
  catch(e){ toast("이 화면에서는 파일을 받을 수 없어요"); }
}
async function resizeImage(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = rej; i.src = url; });
    const max = LIVE ? 1600 : 900, k = Math.min(1, max / Math.max(img.width,img.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    return await new Promise(res => cv.toBlob(res,"image/jpeg",LIVE?.82:.7));
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- actions ---------- */
const A = {
  go: el => go(el.dataset.v),
  reload: () => loadContent(),
  openPending: () => { S.admin.tab = "bookings"; S.admin.filter = "active"; go("host"); },
  hardRefresh: async () => {
    try{ if("caches" in window){ const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } }catch(e){}
    try{ location.replace(appUrl()+"?r="+Date.now()+"#"+S.view); }catch(e){ location.reload(); }
  },
  copy: el => copy(el.dataset.t),
  lightbox: el => { S.lightbox = Number(el.dataset.i); render(); },
  mapOpen: () => { S.mapOpen = true; render(); },
  mapClose: (el,e) => { if(e.target.closest("img,a")) return; S.mapOpen = false; render(); },
  lbMove: (el,e) => { e.stopPropagation(); S.lightbox += Number(el.dataset.n); render(); },
  lbClose: (el,e) => { if(e.target.closest("img")) return; S.lightbox = null; render(); },
  month: el => { S.month = shiftMonth(S.month, Number(el.dataset.n)); render(); },
  pick: el => {
    const d = el.dataset.d, t = todayStr(), c = S.content, {in:ci, out:co} = S.sel;
    if(d < t) return;
    // 이미 체크인이 있으면: 초록 테두리 날짜(1주 단위)를 누르면 기간을 늘리거나 줄임
    if(ci && d > ci && validCheckout(ci, addDays(d,1))){ S.sel.out = addDays(d,1); render(); return; }
    if(ci && co && d > ci && d < co){ toast("기간은 아래 [−1주] [+1주] 버튼이나 초록 테두리 날짜로 바꿀 수 있어요"); return; }
    if(S.busyMap[d]){ toast("이미 예약이 확정된 날짜예요"); return; }
    // 새 체크인: 기본 4주를 자동으로 잡기
    const end = addDays(d, Math.max(unitOf(), c.minNights));
    if(!validCheckout(d, end)){ toast(`이 날부터는 ${weeksLabel(diffDays(d,end))}를 이어서 머물 수 없어요. 중간에 확정된 날이 있어요`); return; }
    S.sel = {in:d, out:end}; render();

    if(validCheckout(ci, nx)){ S.sel.out = nx; render(); return; }
    toast(k < 0 ? `${weeksLabel(Math.max(unitOf(),S.content.minNights))}보다 짧게는 줄일 수 없어요` : (diffDays(ci,nx) > S.content.maxNights ? `최대 ${weeksLabel(S.content.maxNights)}까지 신청할 수 있어요` : "다음 주에 이미 확정된 예약이 있어서 늘릴 수 없어요"));

    if(!document.getElementById(ids[step])) return;
    S.formKey = key; S.formStep = Math.min(step + 1, 2); render();
    const hdr = document.querySelector("header.top"), off = (hdr && getComputedStyle(hdr).position !== "static" ? hdr.offsetHeight : 0) + 12;
    const t = document.getElementById(ids[step]);
    const y = Math.max(0, t.getBoundingClientRect().top + window.scrollY - off);
    try{ window.scrollTo({top:y, behavior:"smooth"}); }catch(e){ window.scrollTo(0,y); }
    setTimeout(() => {
      if(Math.abs(window.scrollY - y) > 60 && window.scrollY + innerHeight < document.body.scrollHeight - 5) window.scrollTo(0, y);

function lastExport(){ return LS.get("stay_last_export", ""); }

function backupList(){
  const b = S.admin.backups;
  if(b === undefined) return `<p class="small muted">백업 목록을 불러오는 중…</p>`;
  if(b === null) return `<p class="small muted">서버 백업 목록을 불러오지 못했어요. 설정 SQL을 최신으로 다시 실행해 주세요.</p>`;
  if(!b.length) return `<p class="small muted">아직 서버 백업이 없어요. '지금 백업'을 눌러 첫 백업을 만들어 보세요.</p>`;
  return `<div class="stack" style="gap:6px"><b class="small">서버 백업 ${b.length}개 · 최근 ${esc(new Date(b[0].created_at).toLocaleString("ko-KR",{timeZone:TZ,month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit"}))}</b>
    ${b.slice(0,5).map(x => `<div class="row small"><span class="grow">${esc(new Date(x.created_at).toLocaleString("ko-KR",{timeZone:TZ,year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit"}))}</span><button class="btn sm" data-a="dlBackup" data-id="${x.id}">파일로 받기</button><button class="btn sm ghost" data-a="restoreBackup" data-id="${x.id}">내용 복원</button></div>`).join("")}</div>`;
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]");
  if(!el) return;
  const fn = A[el.dataset.a];
  if(!fn) return;
  if(el.tagName === "BUTTON" || (el.tagName === "DIV" && el.dataset.a !== "dlgBg" && el.dataset.a !== "lbClose")) e.preventDefault();
  fn(el, e);
});
document.addEventListener("input", e => {

  if(el.dataset.bind && S.admin.draft){
    let v = el.type === "checkbox" ? el.checked : el.value;
    if(el.dataset.num) v = v === "" ? "" : Number(v);
    setPath(S.admin.draft, el.dataset.bind, v); markDirty();
    if(el.dataset.rerender) render();
  }
});
document.addEventListener("change", async e => {
  const el = e.target;
  if(el.dataset.check !== undefined){
    const k = el.dataset.check, lk = S.linked;
    if(lk){
      lk.checks = Object.assign({}, lk.checks, {[k]: el.checked});
      if(!el.checked) delete lk.checks[k];
      if(S.my.result && S.my.result.code === lk.code) S.my.result.checks = lk.checks;
      render();
      try{ const ok = await api.saveChecks(lk.code, lk.last4, lk.checks); if(ok) toast("호스트에게 전달했어요"); else toast("저장하지 못했어요. 호스트에게 카톡으로 알려 주세요"); }
      catch(err){ toast(errMsg(err)); }
    } else { S.checks[k] = el.checked; LS.set("stay_checks", S.checks); render(); }
    return;
  }
  if(el.dataset.a2 === "toggleNotify"){
    if(el.checked && "Notification" in window){
      try{ const p = await Notification.requestPermission(); if(p !== "granted"){ el.checked = false; toast("알림이 허용되지 않았어요. 브라우저 설정에서 허용해 주세요"); return; } }
      catch(err){ el.checked = false; toast("이 화면에서는 알림을 켤 수 없어요"); return; }
    }
    S.admin.notify = el.checked; LS.set("stay_notify", el.checked); return;
  }
  if(el.id === "ph-up" && el.files && el.files.length){
    const d = ensureDraft(); S.admin.busy = true; render();
    try{ for(const f of el.files){ const blob = await resizeImage(f); const url = await api.uploadPhoto(blob); d.photos.push({url, caption:""}); } markDirty(); toast("사진을 올렸어요. 저장을 눌러 주세요"); }
    catch(err){ toast("사진을 올리지 못했어요: " + errMsg(err)); }
    S.admin.busy = false; render();
  }
});
document.addEventListener("submit", async e => {
  const f = e.target; if(!f.dataset.form) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(f).entries());
  const kind = f.dataset.form;
  if(kind === "book"){
    if(v.website) return;
    if(!v.name.trim()){ toast("이름을 입력해 주세요"); return; }
    if(v.phone.replace(/\D/g,"").length < 9){ toast("휴대폰 번호를 확인해 주세요"); return; }
    if(!f.rules.checked){ toast("'이용 안내 및 퇴실 전 지켜주셔야 할 사항'에 동의해 주세요"); document.getElementById("must")?.scrollIntoView({behavior:"smooth",block:"start"}); return; }
    S.sending = true; render();
    try{
      const r = await api.request({name:v.name.trim(), phone:v.phone, kakao:v.kakao.trim(), guests:Number(v.guests), check_in:S.sel.in, check_out:S.sel.out, message:v.message.trim()});
      const last4 = v.phone.replace(/\D/g,"").slice(-4);
      S.submitted = Object.assign({}, r, {name:v.name.trim()}); S.notifyModal = true;
      rememberMy(r.code,last4); S.my.code = r.code; S.my.last4 = last4;
      S.sel = {in:null,out:null}; Object.keys(S.f).forEach(k => { if(k.startsWith("book.")) delete S.f[k]; }); loadBusy(); window.scrollTo(0,0);
    }catch(err){
      toast(errMsg(err));
      if(String(err.message).includes("overlap")){ S.sel = {in:null,out:null}; loadBusy(); }
    }
    S.sending = false; render();
  }
  if(kind === "lookup"){
    const code = (v.code||"").trim().toUpperCase(), last4 = (v.last4||"").replace(/\D/g,"");
    if(!code || last4.length !== 4){ toast("예약코드와 뒤 4자리를 입력해 주세요"); return; }
    doLookup(code,last4);
  }
  if(kind === "login" || kind === "signup"){
    const a = S.admin; a.busy = true; a.err = ""; render();
    try{
      const ok = kind === "login" ? await api.login(v.email.trim(), v.pw) : await api.signup(v.email.trim(), v.pw);
      if(!ok){ api.logout(); S.dialog = {title:"아직 호스트로 등록되지 않은 계정이에요", body:`계정은 만들어졌어요. 기존 호스트에게 '설정 → 호스트'에서 이 이메일(${v.email.trim()})을 추가해 달라고 하신 뒤 다시 로그인하세요.`, okLabel:"확인", noCancel:true}; }
      else { a.authed = true; a.lastPending = null; await loadAdmin(); }
    }catch(err){ a.err = errMsg(err); }
    a.busy = false; render();
  }
  if(kind === "secret"){
    const s = {door_code:v.door_code||"", wifi_name:v.wifi_name||"", wifi_pw:v.wifi_pw||"", private_guide:v.private_guide||"", show_in_app:f.show_in_app.checked};
    try{ await api.saveSecret(s); S.admin.secret = s; toast("저장했어요"); }catch(err){ toast(errMsg(err)); }
  }
});
window.addEventListener("hashchange", () => { const v = viewFromHash(); if(v !== S.view) go(v); });
window.addEventListener("beforeunload", e => { if(S.admin.dirty){ e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("keydown", e => {
  if(S.mapOpen && e.key === "Escape"){ S.mapOpen = false; render(); }
  if(S.lightbox !== null){ if(e.key === "Escape"){ S.lightbox = null; render(); } if(e.key === "ArrowRight" && S.lightbox < S.content.photos.length-1){ S.lightbox++; render(); } if(e.key === "ArrowLeft" && S.lightbox > 0){ S.lightbox--; render(); } }
  else if(S.dialog && e.key === "Escape" && !S.dialog.noCancel){ S.dialog = null; render(); }
});
setInterval(() => { if(S.admin.authed && !S.dialog && !S.admin.dirty) loadAdmin(true); }, 30000);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && S.admin.authed) loadAdmin(true); });
setInterval(() => { if(S.view === "book" && !S.submitted && !S.sending) loadBusy(); }, 60000);

/* ---------- boot ---------- */
(async function boot(){
  await loadContent();
  if(S.view === "book") loadBusy();
  if(S.view === "host") enterHost();
  else if(api.session()) enterHost();
  if(S.view === "my") autoMy();
  if(S.view === "guide") autoLink();
})();
})();
</script>

</body>
</html>
